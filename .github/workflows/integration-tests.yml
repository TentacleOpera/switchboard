name: Integration Tests

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Protocol catalog + verb allowlist drift check
        run: npm run catalog:check

      - name: Compile test outputs
        run: npm run compile-tests

      - name: Compile extension
        run: npm run compile

      - name: Protocol parity check
        run: npm run parity:check

      - name: Push-routing ratchet (Gap A)
        run: npm run push-routing:check

      - name: Standalone push-parity ratchet
        run: npm run standalone-parity:check

      - name: Standalone kanban fork-detector
        run: npm run standalone-fork:check

      - name: Kanban dispatch callers guard
        run: npm run kanban-dispatch-callers:check

      - name: Verb return-contract ratchet
        run: npm run verb-returns:check

      - name: Claude mirror drift check
        run: npm run mirror:check

      # Masked-SVG icons have two representations (icons/icon-*.svg and the base64
      # data: URI inlined into each panel's CSS). Both drift modes are silent on
      # screen — a corrupt payload renders nothing, a missing .sb-icon-<name> rule
      # renders a solid currentColor block — so neither compile nor lint can see
      # them. This is the only gate that can.
      - name: Icon parity check (asset <-> inlined base64, rule coverage)
        run: npm run icons:parity

      # PTY terminals run in BOTH hosts (standalone-only was reversed 2026-07-31).
      # This gate no longer forbids node-pty in the extension bundle — it pins the
      # two structural facts that keep the availability gate auditable: exactly one
      # module loads the native binding, and it exports the probe every capability
      # flag derives from. The no-bundled-binary check needs dist/, so this step
      # must stay AFTER "Compile extension" above.
      - name: PTY host gating contract (single load site, probe exported, no bundled binary)
        run: npm run test:contract:pty-host-gating

      # The PTY verb surface must exist ONLY on /terminals/verb/. That is what stops
      # the VS Code sidebar board (which posts to /kanban/verb/) from spawning a
      # terminal it has no way to display — a routing guarantee, not a convention.
      - name: PTY route surface contract (/terminals/verb only, nothing in the generated surface)
        run: npm run test:contract:pty-route-surface

      # A browser-originated dispatch that correctly lands in a PTY terminal must not
      # also raise a VS Code "Terminal not found" toast. The pre-dispatch focus call is
      # a VS Code-only reveal; a PTY is invisible to it, so the miss warns — reading as
      # a second, failed send next to a dispatch that in fact succeeded. Pins the
      # `silent` opt-out on the three dispatch-path focus calls, the advisory
      # `_isLikelyPtyDispatchTarget` predicate (snapshot-based, no round-trip, no
      # in-process fleet), and that the explicit-focus surfaces keep their warning.
      - name: PTY dispatch focus contract (no spurious VS Code toast on a PTY dispatch)
        run: npm run test:contract:pty-dispatch-focus

      # Browser send-to-terminal dispatch parity: every browser-originated prompt
      # dispatch must thread the apiOriginated surface flag end-to-end so a browser
      # PTY terminal is reachable, the four stray _dispatchExecuteMessage sites
      # (orchestrator/pair/airlock) must be surface-aware, the four direct-to-
      # vscode.Terminal helpers must be fleet-aware and must NOT conjure a VS Code
      # terminal for a browser caller, and every verb a browser panel posts must be
      # reachable on that panel's HTTP route (improvePlan / webviewReady were the
      # original offenders). These are source-text contracts — the failure modes are
      # silent wrong-fleet dispatches and invisible VS Code toasts, not thrown errors.
      - name: Browser planner dispatch surface contract (apiOriginated threading + clipboard fallback)
        run: npm run test:contract:browser-planner-dispatch-surface
      - name: Browser stray dispatch surface contract (orchestrator/pair/airlock surface-aware)
        run: npm run test:contract:browser-stray-dispatch-surface
      - name: Browser direct terminal helpers contract (fleet-aware, no conjured terminals)
        run: npm run test:contract:browser-direct-terminal-helpers
      - name: Browser panel verb routing contract (every posted verb reachable on its route)
        run: npm run test:contract:browser-panel-verb-routing

      # /ws/terminal is an RCE-grade channel. This pins the gateway's empty-token
      # rejection, the untouched HTTP loopback-trust path the skill ecosystem rides
      # on, and the CSP-legal token transport (a nonce-less inline <script> is
      # blocked, which silently produces terminals that render but never stream).
      - name: Terminal token transport contract (gateway auth + CSP-legal injection)
        run: npm run test:contract:terminal-token-transport

      # PtyFleetService.rename mutates handle.name IN PLACE, so the gateway's onData
      # closure switches to the new name while every name-keyed map is still filed
      # under the old one — a renamed terminal with no scrollback ring at all (blank
      # on re-attach, every frame stamped seq 0, leaked onData subscription on close).
      # The load-bearing assertion here is the drift one: it derives the collection
      # list from untrackTerminalData rather than hardcoding it, so a name-keyed map
      # added later cannot be torn down on close while being skipped on rename.
      - name: Terminal rename re-key contract (every name-keyed collection moves)
        run: npm run test:contract:terminal-rename-rekey

      # The Host-header guard is the DNS-rebinding defence on a board that serves
      # an RCE-grade terminal, so every failure here is silent and security-shaped:
      # widening the pattern past the RFC 6761 `.localhost` reservation (to
      # `127.0.0.0/8`, or to any name merely CONTAINING "localhost") readmits
      # attacker-controlled names; a second predicate drifting from the module
      # gives a CLI that prints a URL the server then 403s; and a CSP that allows
      # `ws://localhost` without `ws://*.localhost` yields a board that renders
      # but never streams. Also pins that --hostname stays presentation — the
      # socket still binds loopback only.
      - name: Loopback hostname contract (rebinding guard, one predicate, CSP parity)
        run: npm run test:contract:loopback-hostname

      # Cross-file mismatches that are invisible file-by-file, and each one shipped:
      # terminals.js called term.onFocus (an INTERNAL xterm emitter) and the throw took
      # the WebSocket with it — panes read "connecting" forever; tickets.html shipped a
      # CSP with no connect-src, so default-src blocked every fetch and the browser
      # Tickets panel reached no source at all.
      - name: Browser panel runtime surface (xterm API subset, connect-src reachability)
        run: npm run test:contract:panel-runtime-surface

      # .vscodeignore negations override ignores UNCONDITIONALLY, so a blanket
      # un-ignore of node-pty silently re-includes 28 MB of .pdb debug symbols past
      # the Marketplace upload cap. This runs vsce's real filter over the real tree.
      - name: VSIX packaging contract (no debug symbols, runtime files present, publish mechanics)
        run: npm run test:contract:vsix-packaging

      - name: Design asset route security contract
        run: npm run test:contract:design-asset

      - name: Design per-client reply addressing regression
        run: npm run test:contract:design-reply-addressing

      - name: Design system contract (tokens, block framing, binding)
        run: npm run test:contract:design-system

      - name: Cross-client project scope contract (initiator threading, scoped push rendering)
        run: npm run test:contract:cross-client-scope

      # The sandbox guard is what keeps a test run from writing the developer's REAL
      # machine-global integration config — tokens included. It must fail CLOSED: a
      # guard that silently no-ops when it cannot detect the sandbox is worse than
      # none, because the suite still passes while clobbering live credentials. Pins
      # the fail-closed throw and the production-shape check that must NOT trip.
      - name: Global config sandbox contract (fail-closed guard, no real-file writes)
        run: npm run test:contract:global-config-sandbox

      # renderMarkdown feeds webview HTML, so its output is an XSS surface as much as
      # a formatting one, and block-transition bugs (list-then-table, table-then-list)
      # are the classic way a hand-rolled renderer starts emitting unbalanced tags.
      - name: Shared renderMarkdown contract (block transitions, escaping)
        run: npm run test:contract:rendermarkdown

      - name: Headless feature management contract (capability derivation, verb schemas, standalone wiring)
        run: npm run test:contract:headless-feature-mgmt

      - name: Headless feature management destructive contract (reconcile, delete, split, watcher, WS push)
        run: npm run test:contract:headless-feature-mgmt-destructive

      - name: Verb engine kanban contract (seams, db path, return contract)
        run: npm run test:contract:verb-engine-kanban

      # Runs under the vscode BOOBY TRAP (any `vscode.*` property access throws),
      # so this gate is what keeps TaskViewerProvider constructible off-editor:
      # put host work back into the constructor — a class-field
      # `createOutputChannel`, a watcher, an event subscription — and this goes red
      # even though the extension still boots fine. It also pins the arms
      # themselves, including the terminal-name resolution that reads the host name
      # from the `appName` seam rather than `vscode.env` (vscodeShim never defined
      # appName, so standalone was searching for `<name>-undefined`).
      - name: Verb engine headless seams contract (pure ctor under vscode trap, arm host-agnosticism)
        run: npm run test:contract:verb-engine

      # Planning's counterpart. The load-bearing assertion is that a verb fails
      # IN-BODY rather than throwing across the HTTP boundary — a throw here
      # becomes a 500 with no structured error for the webview to render.
      - name: Verb engine planning contract (in-body failure, schema validation, seam routing)
        run: npm run test:contract:verb-engine-planning

      # Receives the ticket-verb assertions as they migrate off Planning, slice by
      # slice. It was added in 2b with a package.json script but no workflow step,
      # which is the "green while incomplete" hole: the suite passed locally and
      # guarded nothing in CI.
      - name: Verb engine tickets contract (in-body failure, schema validation, allowlist gating)
        run: npm run test:contract:verb-engine-tickets

      # The Connections panel is the only one that spans two providers. This pins
      # that the extension-host forwarder and the /connections/verb/ HTTP branch
      # resolve every posted verb to the same provider, and that the forwarder
      # contributes no verb arms of its own.
      - name: Connections dual-provider routing contract
        run: npm run test:contract:connections-routing

      - name: Design per-client view state contract (seats, poll lifecycle, wsHub keepalive)
        run: npm run test:contract:design-view-state

      - name: STITCH HTML tab contract (preview failure in body, docs in body, spinner-lowering table)
        run: npm run test:contract:stitch-html-tab

      - name: Webview shim injection contract (SHARED_DEFAULTS_SCRIPT marker, shim-before-consumer ordering)
        run: npm run test:contract:shim-injection

      - name: Setup panel element-ids contract (no orphaned getElementById reads, prompts-override residue gone)
        run: npm run test:contract:setup-panel-element-ids

      # BroadcastHub is shared by the extension host (~4,000 installs) and the
      # standalone/npx host. Headless mode suppresses the pre-webview queue that
      # would otherwise grow unbounded (one hub, six providers, 40 ms coalesced
      # push loop). The load-bearing assertion is the EDITOR one: a naive "drop
      # when no webview is bound" fix looks identical in standalone and silently
      # breaks every cold panel open in the extension.
      - name: BroadcastHub headless-mode contract (no headless retention, editor cold-start queue intact)
        run: npm run test:contract:broadcast-hub-headless

      - name: Reviewer prompt anti-artifact contract (directive presence, completion handshake co-existence)
        run: npm run test:contract:reviewer-prompt

      - name: Kanban card-button drag guard contract
        run: npm run test:contract:drag-guard

      - name: Kanban optimistic render guard contract
        run: npm run test:contract:render-guard

      # A dropped card must become authoritative a DB write after the drop, not a
      # full agent dispatch later. The three drag arms persist → post `moveCards` →
      # dispatch; the converted arms (moveSelected/moveAll) regressed on this once
      # already and nothing guarded the drag arms. This also pins the recentlyDropped
      # animation fence and the ONE surviving 350ms timer (completePlan's card-EXIT
      # fence), so a cleanup sweep can neither reintroduce the drop-dispatch delay
      # nor delete the exit fence as its twin.
      - name: Kanban drag confirm-before-dispatch contract (persist→echo→dispatch, animation fence)
        run: npm run test:contract:drag-confirm-order

      # Retention used to sort backups by filename, which leads with the reason — so
      # every `bulk-change` snapshot (taken right before a mass mutation of user plan
      # data) sorted ahead of `pre-migration` and was always deleted first. This test
      # pins per-reason retention, the throttle, and the per-reason content dedupe.
      - name: Kanban DB backup retention contract (per-reason cap, throttle, dedupe)
        run: npm run test:contract:db-backup-retention

      # The machine-global secrets store is the ONLY copy of a standalone user's API
      # tokens. Three separate paths silently destroyed them and all three read fine
      # in a diff: an un-awaited migration loop that renamed the legacy store away
      # before importing from it, an activation sweep that deleted every key the
      # keychain did not hold, and a decrypt failure that condemned a healthy store
      # written by a host holding SWITCHBOARD_MASTER_PASSPHRASE. Keep this wired.
      - name: Standalone secrets bridge contract (migration receipts, mirror direction, no destructive decrypt)
        run: npm run test:contract:secrets-bridge

      - name: Tickets sidebar list scoping contract
        run: npm run test:contract:tickets-sidebar-scoping

      # 2026-08-05: the delta refresh sweep unlinked five live ticket files and their
      # imported_docs rows while ClickUp still held all five tasks. Its authorisation
      # check meant "did not throw", and _fetchListTasksInternal returns short results
      # without throwing. Deletion here is irreversible — the file AND its DB row go,
      # so nothing records that the file ever existed. Every ambiguous case must
      # resolve to no-delete. Keep this wired.
      - name: Tickets delta deletion-sweep authorisation gate (short fetch must not delete)
        run: npm run test:contract:tickets-delta-sweep-gate

      # eaee275a widened the conflict guard from "delta pulls" to "all pulls" as a drive-by
      # in an unrelated commit, with no test. That removed the ONLY escape from a ticket
      # flagged locally-modified — the delta cursor advances past skips, so a delta pull
      # never re-offers it — and a live ticket sat 3 days stale while Push stood ready to
      # replace newer remote work with it. Holds the whole chain: Refetch is authoritative,
      # Refresh/includeClosed is not, the stamp precedes orphan cleanup (and orphan cleanup
      # does not delete the row it just stamped), and a stale push is refused.
      - name: Tickets refetch full-pull regression (Refetch must refetch)
        run: npm run test:contract:tickets-refetch-full-pull

      # Tickets replies are BROADCAST to every surface. Unstamped, a reply for another
      # panel's list is indistinguishable from your own and overwrites the sidebar
      # ("flashes with a lot of stuff and then disappears"). Both halves — the backend
      # stamp and the frontend predicate — must stay; either alone reintroduces it.
      - name: Tickets cross-panel reply scope contract (stamp + filter)
        run: npm run test:contract:tickets-cross-panel-scope

      - name: Tickets subtask embedding contract
        run: npm run test:contract:tickets-subtasks

      # Four independent faults each produced "agent edits a ticket file, the sidebar
      # shows nothing until you click Refresh" — so a partial regression is invisible:
      # it looks exactly like the original bug. Also holds the two hazards the fix
      # introduces: a rename is delete+create (must not drop the card), and the
      # standalone watcher seam must stay real or the browser host silently loses this.
      - name: Tickets auto-refresh on local file change contract
        run: npm run test:contract:tickets-auto-refresh

      - name: Project pin apply-if-empty contract (fill, no-move, subtask-skip)
        run: npm run test:contract:project-pin-fill

      - name: Project pin same-snapshot resolve contract (first-import, fallback, resolve-only)
        run: npm run test:contract:project-pin-resolve

      - name: Memo panel style contract (default-theme class must not repaint, canonical tokens, load-bearing ids)
        run: npm run test:contract:memo-panel-style

      - name: Memo browser clear/copy contract (typed body, memoCleared, failure preserves memo, WS fan-out wiring)
        run: npm run test:contract:memo-browser-clear

      - name: Memo panel workspace binding contract (per-render root, cross-workspace PROJECT PIN guard)
        run: npm run test:contract:memo-workspace-binding

      - name: Browser panel scrollbar contract (@supports gating, no ungated scrollbar-width)
        run: npm run test:contract:panel-scrollbars

      # The browser kanban pane inherited raw SQL order (ORDER BY updated_at DESC
      # over a TEXT column with mixed ISO-8601, SQLite datetime, and one non-timestamp
      # value), so cards appeared in a different order than the extension board —
      # including a card permanently pinned to the top by a 'reviewer-pass' string.
      # Pins the client-side sort comparator, the sort-before-signature ordering
      # (an infinite re-render loop otherwise), and board/pane comparator parity.
      - name: Browser kanban pane card order contract (sort-before-signature, board parity)
        run: npm run test:contract:browser-kanban-pane-order

      # _INSPECTOR_SCRIPT is a template literal inside a .ts file, so TypeScript pasted
      # into it compiles clean and only fails when a browser parses the injected
      # <script> — and that failure is total and silent (dims reporting, wheel
      # forwarding, Space-pan and Inspect Mode all die at once). A review pass caught
      # exactly that: an `export function` with type annotations shipped inside the
      # literal. This test parses the emitted script and pins the fluid-vs-intrinsic
      # classifier that stops fluid pages collapsing to a narrow column. Keep it wired.
      - name: HTML preview fluid width regression (injected script parses, fluid/intrinsic classifier)
        run: npm run test:contract:html-preview-fluid-width

      # Wired during the assignee-filter review pass. Two defects the plan-compliance
      # view missed: the option builder keyed strictly on assignee `id`, but the
      # file-backed sidebar path (localTicketFilesListed) carries assignee NAMES only —
      # so the dropdown listed nobody in the tab's steady state; and Linear/ClickUp share
      # ONE <select> while caching its html per-provider, so a workspace round-trip left
      # the other provider's options in the DOM and silently wiped the saved filter.
      # This test pins the name-fallback identity, the single shared cache, and 1:1
      # reset-site parity with the status filters (a missed reset = empty sidebar).
      - name: Tickets assignee filter regression (name-fallback identity, shared cache, reset parity)
        run: npm run test:contract:tickets-assignee-filter

      # Wired during the panel-revival review pass. Restored panels are now re-created
      # rather than adopted (retainContextWhenHidden is creation-time-only), which makes
      # three things load-bearing and silently breakable: no listeners may be wired to the
      # discarded panel (use-after-free on dispose ordering), the serialized setState
      # payload must be forwarded into the new webview (or every persisted preference
      # resets on each window reload), and preserveFocus must apply on revival ONLY (or
      # user-invoked panel commands stop taking focus).
      - name: Panel revival retention contract (no adoption, state forwarding, focus discipline)
        run: npm run test:contract:panel-revival-retention

      # Wired during the terminal-responsiveness review pass. Every failure mode of an
      # ack/credit scheme is SILENCE, not an error: a lost ack, a counter not reset on
      # reconnect, a replay burst billed against the budget, or a disposed view still
      # holding credit all produce a terminal that just stops printing. None of that is
      # reachable from a behavioural test, so the mitigations are pinned as source-text
      # contracts — including the two the first implementation got wrong (flushBatch
      # guarding on `exited`, which threw away the final output of every exiting
      # process, and the MAX_PAUSE_MS valve measuring elapsed pause instead of ack
      # stall, which force-disabled backpressure every 10s under sustained load).
      - name: Terminal flow control + view lifecycle contract (ack credit, page-level drain, WebGL cap)
        run: npm run test:contract:terminal-flow-control

      # GPU renderer lifecycle. The failure mode is SILENT SUCCESS: WebglAddon.dispose()
      # leaves the live WebGL2 context to the garbage collector, and the browser charges
      # its ~16-per-renderer-process ceiling against the live context — so a release path
      # that only disposes reports a freed budget in every in-panel signal
      # (liveWebglContexts, isWebgl, __sbTerminalStats) while the process frees nothing.
      # Pins the explicit WEBGL_lose_context call, the one-shot release closure that makes
      # the counter unable to drift, and the vendored addon._renderer._gl hop, so an xterm
      # bump breaks the build instead of quietly turning the reclaim into a no-op.
      - name: Terminal renderer lifecycle contract (one-shot release, real context handback, swap ordering)
        run: npm run test:contract:terminal-renderer-lifecycle

      # The chunk-boundary logic is the entire input plan. A cut inside a multi-byte
      # codepoint silently corrupts pasted text; a cut inside \x1b[200~ turns a paste
      # into an escape plus literal text. Neither throws. This pins the CSI parse in
      # particular — the first implementation treated the `[` introducer as a
      # terminator, which declared every CSI sequence complete at its second byte.
      - name: Terminal input path contract (binary frames, UTF-8/CSI-safe chunking, FIFO pacing)
        run: npm run test:contract:terminal-input-path

      # Solo pop-out. Every guard here is a silent failure: an unsuppressed saveSetting
      # lets a pop-out rewrite the docked panel's layout; an unpinned pane assignment
      # lets the detach timer destroy the window's own scrollback 15s after an operator
      # close; a missing pre-set of initialAssignmentDone opens a DIFFERENT agent's
      # terminal under the requested name. Also pins the eviction sentinel across the
      # terminals.js / terminalWsGateway.ts file boundary — reword it on the server and
      # the client goes back to rendering a live terminal as "[Process Exited with code
      # -1]", stdin disabled, no reconnect.
      - name: Terminal solo pop-out contract (write suppression, slot pin, eviction vs exit)
        run: npm run test:contract:terminal-solo-popout

      # Answerback suppression during scrollback replay. Fails silently by nature: the
      # replay re-parses queries the CLI emitted while the view did not exist, xterm
      # answers them, and the reply lands at the prompt as typed text. Nothing throws —
      # the operator just sees `10;rgb:e0e0/e0e0/e0e011;rgb:1717/1717/1717`. Pins the
      # reply grammar (positive AND negative cases, so a widened final class that eats
      # keystrokes fails here) and the three structural properties that would silently
      # un-fix it: onData's dual condition, the replay's own write, hello-armed window.
      - name: Terminal answerback replay contract (reply grammar, suppression window)
        run: npm run test:contract:terminal-answerback

      # Pane fit verification. Fails invisibly by nature: the buffer ends up the right
      # size while the CANVAS keeps painting the old grid, and FitAddon.fit()
      # short-circuits on matching cols/rows, so no later fit from any call site can
      # repair it. Pins the two decisions that silently un-fix it — fitAndReportSize
      # gated on a verified buffer mismatch alone (it reports unconditionally, and the
      # gateway takes the MIN across clients), and the renderer repair gated on
      # stale-canvas alone — plus the declaration order the spans depend on.
      - name: Terminal pane fit verification contract
        run: npm run test:contract:terminal-pane-fit

      # Pane grid in-place reconcile. `innerHTML = ''` detached every live xterm on
      # every render, which churned xterm's IntersectionObserver pause and made pane
      # sizing a race. Pins the in-place invariant, listeners at creation only, terse
      # labels re-derived from the live layout, the detach sweep still testing the FULL
      # nine-slot assignment array, and the before/after caret predicate.
      - name: Terminal pane grid reconcile contract
        run: npm run test:contract:terminal-pane-grid-reconcile

      - name: Terminal focus affordance contract (ring, chip, drop notice)
        run: npm run test:contract:terminal-focus-affordance

      # The four client-side connection/throttle notices (input queue drained,
      # pasting, terminal unavailable, disconnected-reconnecting) used to be
      # written straight into xterm's buffer, permanently desynchronising any
      # Ink-based TUI's relative-cursor redraw. Pins their absence, the chrome
      # that replaced them (queued chip + error toast), the call-site count, and
      # the resolver-key-derived removal-set invariant.
      - name: Terminal chrome not in buffer contract (notices on chrome, not buffer)
        run: npm run test:contract:terminal-chrome-not-in-buffer

      # Shell terminal strip. The two defects a screenshot review waves through: the
      # bottom anchor is an INLINE style on the theme toggle, so a second
      # `margin-top: auto` child parks the terminal list mid-strip instead of stacking;
      # and `assignToFocusedPane` early-returns when the terminal is already in the
      # focused pane — the most likely case for a click on a lit entry — so a delegated
      # badge clear leaves the completion light burning after the click.
      - name: Shell terminal strip contract (light precedence, bottom anchor, badge clear)
        run: npm run test:contract:shell-terminal-strip

      - name: Terminal pane pinning contract
        run: npm run test:contract:terminal-pane-pinning

      - name: Terminal sidebar groupings contract
        run: npm run test:contract:terminal-sidebar-groupings

      # OPEN AGENT TERMINALS seating. Three defects from one click, all silent:
      # pane 0 seated by the seed-on-first-load branch instead of the create loop
      # (instant first pane, then a gap), a curtain armed into an already-rendered
      # pane that nothing repaints, and six created terminals seated into a grid of
      # four with no message. Pins the grow ladder (slot-ascending, no '2v'), the
      # initialAssignmentDone disarm sitting AFTER the wanted.size guard, the
      # arm-before-seat ordering, persist-once-in-the-tail, the unseated toast, and
      # the single `await fetchTerminalList()` that multi-parent-terminals-contract
      # uses as a block marker.
      - name: Terminal open-all seating contract (grow ladder, curtain, remainder toast)
        run: npm run test:contract:terminal-open-all-seating

      - name: Terminal sidebar role ordering contract
        run: npm run test:contract:terminal-sidebar-role-ordering

      # Terminal scroll affordance. Both halves of this one fail SILENTLY, which is
      # why it needs a gate rather than a manual pass. CSS: the terminal rules are
      # scoped (.xterm-viewport::-webkit-scrollbar) and the Firefox override lives
      # inside the @supports gate — un-scope either and Chromium 121+ / Safari 17.4+
      # drop every ::-webkit-scrollbar rule on the affected scrollers, with no error.
      # JS: the jump-to-latest pill needs BOTH event sources. term.onScroll does not
      # fire for operator scrolling (Viewport passes suppressScrollEvent:true), and
      # the DOM scroll event does not fire for new output advancing baseY. Collapsing
      # them to one "simpler" subscription leaves a pill that never appears in an idle
      # terminal — the exact reported scenario — while every other test stays green.
      - name: Terminal scroll affordance contract (scoped scrollbar, dual-source jump pill)
        run: npm run test:contract:terminal-scroll-affordance

      - name: Terminal DEC mode restore contract
        run: npm run test:contract:terminal-dec-mode-restore

      # Scrollback replay gap detection + safe parse start. Two defects: (A) the
      # replay filter could not tell "missed nothing" from "missed everything was
      # evicted", splicing survivors onto a stale screen; (B) the first retained
      # chunk can begin mid-escape-sequence. Pins the exact gap comparison, the
      # ring-head-gated trim, the in-band RIS reset on the hello arm, the separate
      # terminalReplayGaps set (not terminalBadges), and the derived clear-site
      # invariant. Behavioural cases for the three exported pure helpers run when
      # out/ is compiled.
      - name: Terminal replay gap contract (gap detection, safe parse start)
        run: npm run test:contract:terminal-replay-gap

      # NOT wired, deliberately — `test:contract:terminal-operations-no-periodic-reopen`
      # is now runnable (the script was missing entirely until the multi-parent review
      # pass) but it FAILS on main, and it fails STALE rather than catching a
      # regression: its fourth assertion pins `toFields`, `getCustomAgents` and
      # `getJulesAutoSyncSetting` in implementation.html, and none of those three
      # identifiers exist in that file any more. Assertions 1-3 pass. Repairing it
      # means re-deriving the current Terminal Operations onboarding contract, which
      # is its own ticket; wiring it as-is would just paint CI red. Named in the
      # regression surface of every terminal plan since it was written.

      # Multi-parent workspace terminals. Every failure mode of the path resolver is
      # SILENT — a prefix test instead of a segment test files a sibling directory
      # under the wrong parent, a shortest-match win picks the wrong overlapping
      # mapping, and forgetting the disabled-mappings case returns an empty parents[]
      # for the majority of operators. Nothing throws; the label is just wrong, which
      # is the bug the feature exists to remove. Also pins the two host-parity traps:
      # the proxy must resolve through KanbanProvider's wrapper (which honours
      # kanban.controlPlaneRoot) so the browser + and OPEN AGENT TERMINALS agree, and
      # the standalone host must translate parentRoot itself since it has no proxy.
      - name: Multi-parent terminals contract (attribution, spawn targeting, hierarchy)
        run: npm run test:contract:multi-parent-terminals

      # The external-agent file protocol has no human in the loop, so every failure
      # here is silent by construction: a claim that never expires wedges an inbox
      # item forever, a planId handed to the session_id-keyed move path skips every
      # card while reporting success, a run-log re-read duplicates history, and an
      # eager mkdir scaffolds .switchboard/ into workspaces that never opted in.
      # Also pins that the fakes mirror the REAL API surface — the first version of
      # this suite asserted against db.all/db.run and a planId-keyed move, none of
      # which exist.
      - name: Scheduled jobs + Connections contract (claims, declared moves, ingestion, spark)
        run: npm run test:contract:scheduled-jobs

      # Spark context artifact curation: selected AGENTS.md sections, jobs protocol,
      # exclusions, anti-confabulation rule, and a secret-leak assertion.
      - name: Spark context exporter contract
        run: npm run test:contract:spark-context-exporter

      # Column ID -> UI label. The bug this guards is invisible to every other gate:
      # `CREATED` renders as "New", `PLAN REVIEWED` as "Planned", `CODE REVIEWED` as
      # "Reviewed", and no string transform derives any of them — so an agent asked
      # about "the New column" denies it exists while looking at the same board. Pins
      # the resolver, the exported `**Label:**` line, ID-before-label precedence on the
      # write path (a custom column named "New" must never capture CREATED's moves),
      # the AUTOCODE many->one refusal, and the ten-entry DEFAULT_KANBAN_COLUMNS guard
      # that stops BACKLOG/CODED being re-added and rendering as extra board columns.
      # SCOPED to the parity test by --grep on purpose: the sibling "Dispose triggers a
      # final export flush" test in the same file FAILS on main and fails STALE, not as
      # a regression — _writeLocalBoardMirror early-returns on an unchanged content hash
      # (KanbanDatabase.ts, `hash === this._localMirrorLastHash`), so deleting the file
      # and re-flushing legitimately no-ops. Widening this step without repairing that
      # test first would just paint CI red.
      - name: Kanban column label parity (resolver, export, write-path precedence, definition guard)
        run: npm run test:contract:kanban-column-labels

      # Every failure mode of surface scoping is a panel that silently stops updating.
      # Pins the three traps: untagged-means-everyone, parse-before-resync, and
      # every-panel-gets-`common`. Also pins the client/server panel-map mirror (a
      # webview cannot import the .ts constant) and the deliberate absence of
      # `project`, which must stay fail-open until PlanningPanelProvider stops tagging
      # project-bound pushes as 'planning'.
      - name: WS surface scoping contract (fail-open, resync filtering, producer tagging)
        run: npm run test:contract:ws-surface-scoping

      # The "New Window freeze" discriminator, and the only regression guard on the
      # bounded resync. handleUpgrade awaits getFullState BEFORE _connections.add(meta);
      # unbounded, a snapshot that never settles leaves the socket OPEN on the wire (the
      # client's onopen already fired) while the connection sits permanently outside the
      # broadcast set — every push skipped, no close event, so no reconnect either. Two
      # of these cases fail against that shape and pass against the timeout, so the file
      # discriminates rather than merely describing. Also pins the meta.seq === 0 guard
      # that keeps a LATE snapshot from clobbering an already-delivered delta, which is
      # the failure this fix could otherwise have traded the freeze for.
      - name: WS popout broadcast contract (stalled resync cannot orphan a connection)
        run: npm run test:contract:ws-popout-broadcast

      # Wired during the Setup-hydration review pass. Both halves of this fix fail
      # SILENTLY and identically — a browser /setup panel that renders every control
      # at its unset default. A stateless `setApiServer` (called at activation, before
      # _initSetupService builds the hub) drops the LocalApiServer on the floor, so the
      # WS mirror is off for the whole session; and even with the reference repaired,
      # the inline `ready` post races wsHub's subscribe-after-snapshot ordering, so the
      # mount-time fan-out can be broadcast to zero subscribers. Neither is reachable
      # from a behavioural test (the verb still returns {success:true} and the VS Code
      # webview path still works), so the mitigations are pinned as source contracts:
      # the cached setter, the non-null hub construction, the early-return re-apply,
      # the __resync-keyed subscribe signal, and the setup.html re-request. Also pins
      # kanban.html's shape guard — Setup pushes `kanbanStructure` as `items` while
      # KanbanProvider pushes `structure`, and an unguarded read blanked the kanban
      # panel's Setup-tab column list the moment the WS mirror started working.
      - name: Setup panel WS hydration contract (cached server, subscribe signal, re-request)
        run: npm run test:contract:setup-panel-ws-hydration

      # Wired during the scrollbar-styling review pass. The scrollbar block was
      # appended to project.html's <style> in a way that DELETED the preceding
      # `.review-mode-btn.active` rule and reused its closing brace, silently
      # killing the Review toggle's active state on a shipped webview. The
      # scrollbar contract test could not see it — presence-only assertions never
      # notice a pre-existing rule going missing. THIS test caught it and was
      # invoked by no workflow. It is the guard against CSS-append clobber in
      # project.html; keep it wired.
      - name: Project panel review mode (review buttons + popup/active-state CSS survive edits)
        run: node src/test/project-panel-review-mode.test.js

      # `npm run lint` is named as an automated check by many plans but was
      # invoked by no workflow. It exits 0 today (0 errors, warnings only), so
      # wiring it gates future ERRORS without going permanently red.
      # KNOWN LIMITATION: eslint.config.js scopes rules to `**/*.ts` ONLY, so this
      # step gives ZERO coverage of src/webview/*.js and src/test/*.js. Do not read
      # a green lint step as "the webview JS was linted" — widening the config to
      # .js needs its own plan (it would surface an unmeasured warning backlog).
      - name: Lint (TypeScript only — see limitation above)
        run: npm run lint

      # Paste attribution + clipboard copy contract: verifies the extractPastedDispatchIdentity
      # scanner, the arm/commit state machine in term.onData, the attributePasteDispatch DB
      # writer, the attributePastedPrompt verb surface (catalog + allowlist + schema), and the
      # kanban-pane Copy Prompt handler's client-side clipboard write. Wired during review
      # because the plan defined it in package.json but no CI step invoked it.
      - name: Paste attribution + clipboard copy contract
        run: npm run test:contract:paste-attribution

      # Dispatch-analysis candidate set: pins the project scoping of the
      # dispatchAnalyze arm (all four initiatorProject forms), the feature-is-one-unit
      # prompt filter, the SEVENTH-argument threading (the fifth is
      # targetTerminalOverride — a project name there aborts the batch), the four
      # PROJECT= spellings the skill's table dispatches on, and the boundary schema.
      - name: Dispatch-analysis scope + feature-atomicity contract
        run: npm run test:contract:dispatch-analysis-scope

      - name: Run integration suite
        run: npm run test:integration:all

