  <rect x="-4" y="-12" width="8" height="4" fill="#000"/>
  <rect x="-4" y="-8" width="8" height="4" fill="#000"/>
  <rect x="-8" y="-4" width="4" height="4" fill="#000"/>
  <rect x="-4" y="-4" width="8" height="4" fill="#000"/>
  <rect x="4" y="-4" width="4" height="4" fill="#000"/>
  <rect x="-12" y="0" width="4" height="4" fill="#000"/>
  <rect x="-8" y="0" width="16" height="4" fill="#000"/>
  <rect x="8" y="0" width="4" height="4" fill="#000"/>
  <rect x="-16" y="4" width="4" height="4" fill="#000"/>
  <rect x="-12" y="4" width="24" height="4" fill="#000"/>
  <rect x="12" y="4" width="4" height="4" fill="#000"/>
  <rect x="-20" y="8" width="4" height="4" fill="#000"/>
  <rect x="-16" y="8" width="4" height="4" fill="#000"/>
  <rect x="-12" y="8" width="8" height="4" fill="#000"/>
