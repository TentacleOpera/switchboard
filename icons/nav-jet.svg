<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -28 64 64" width="64" height="64" shape-rendering="crispEdges">
  <title>Jet</title>
  <!-- The afc-jet silhouette from agent-fleet-air-combat-detailed.svg, all three
       shading layers flattened. Painted with an explicit opaque fill, NOT
       currentColor: this file is consumed as a CSS mask-image (.strip-glyph sets
       background-color and masks with it), and currentColor in a mask has no
       context to resolve against, so it masked to nothing. -->
