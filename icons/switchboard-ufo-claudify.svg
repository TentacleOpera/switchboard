<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="ufo-claudify-title ufo-claudify-desc" shape-rendering="crispEdges">
  <title id="ufo-claudify-title">Hovering pixel art UFO</title>
  <desc id="ufo-claudify-desc">A dark metallic flying saucer with animated terracotta lights hovering over a warm beam.</desc>
  <defs>
    <filter id="claudify-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="beam-claudify" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D97757" stop-opacity=".24"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .ufo { animation: hover 3.2s steps(8, end) infinite; transform-origin: 160px 82px; }
    .beam { animation: beam-pulse 1.6s steps(4, end) infinite; transform-origin: 160px 108px; }
    .light-a { animation: light-a 1.2s steps(2, end) infinite; }
    .light-b { animation: light-b 1.2s steps(2, end) infinite; }
    .star-a { animation: twinkle 2.4s steps(2, end) infinite; }
    .star-b { animation: twinkle 2.4s steps(2, end) 1.2s infinite; }
    @keyframes hover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes beam-pulse {
      0%, 100% { opacity: .45; transform: scaleX(.9); }
      50% { opacity: .9; transform: scaleX(1); }
    }
    @keyframes light-a { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .25; } }
    @keyframes light-b { 0%, 49% { opacity: .25; } 50%, 100% { opacity: 1; } }
    @keyframes twinkle { 0%, 49% { opacity: .2; } 50%, 100% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) {
      .ufo, .beam, .light-a, .light-b, .star-a, .star-b { animation: none; }
    }
  </style>
  <g fill="#D97757" filter="url(#claudify-glow)">
    <rect class="star-a" x="40" y="36" width="4" height="4"/>
    <rect class="star-b" x="268" y="54" width="4" height="4"/>
    <rect class="star-b" x="74" y="126" width="3" height="3"/>
    <rect class="star-a" x="248" y="132" width="3" height="3"/>
  </g>
  <g class="beam">
    <path d="M128 104h64l32 68H96z" fill="url(#beam-claudify)"/>
    <rect x="112" y="168" width="96" height="4" fill="#D97757" opacity=".16"/>
  </g>
  <g class="ufo">
    <g filter="url(#claudify-glow)" opacity=".35" fill="#D97757">
      <rect x="112" y="50" width="96" height="4"/>
      <rect x="88" y="70" width="144" height="20"/>
      <rect x="104" y="90" width="112" height="12"/>
    </g>
    <path d="M136 42h48v4h12v8h8v16h-88V54h8v-8h12z" fill="#241d1a"/>
    <rect x="136" y="46" width="48" height="4" fill="#665e5a"/>
    <rect x="124" y="54" width="72" height="16" fill="#3a3634"/>
    <rect x="132" y="50" width="56" height="4" fill="#a6a09c"/>
    <rect x="136" y="54" width="48" height="12" fill="#0f0d0b"/>
    <rect x="144" y="54" width="32" height="4" fill="#4a2318"/>
    <rect x="152" y="58" width="24" height="4" fill="#E2A188" opacity=".55"/>
    <rect x="104" y="66" width="112" height="4" fill="#665e5a"/>
    <rect x="88" y="70" width="144" height="8" fill="#3a3634"/>
    <rect x="72" y="78" width="176" height="12" fill="#241d1a"/>
    <rect x="88" y="90" width="144" height="8" fill="#0f0d0b"/>
    <rect x="104" y="98" width="112" height="4" fill="#3a3634"/>
    <rect x="120" y="102" width="80" height="4" fill="#241d1a"/>
    <rect x="72" y="82" width="16" height="4" fill="#665e5a"/>
    <rect x="232" y="82" width="16" height="4" fill="#665e5a"/>
    <g fill="#D97757" filter="url(#claudify-glow)">
      <rect class="light-a" x="96" y="82" width="12" height="8"/>
      <rect class="light-b" x="120" y="86" width="12" height="8"/>
      <rect class="light-a" x="144" y="88" width="12" height="8"/>
      <rect class="light-b" x="168" y="88" width="12" height="8"/>
      <rect class="light-a" x="192" y="86" width="12" height="8"/>
      <rect class="light-b" x="216" y="82" width="12" height="8"/>
    </g>
    <rect x="156" y="98" width="8" height="8" fill="#E2A188" filter="url(#claudify-glow)"/>
  </g>
</svg>
