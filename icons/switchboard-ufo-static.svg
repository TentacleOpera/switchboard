<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="ufo-title-static ufo-desc-static" shape-rendering="crispEdges">
  <title id="ufo-title-static">Hovering pixel art UFO</title>
  <desc id="ufo-desc-static">A dark metallic flying saucer with cyan lights hovering over a faint blue beam.</desc>
  <defs>
    <filter id="cyan-glow-static" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="beam-static" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g fill="#00e5ff" filter="url(#cyan-glow-static)">
    <rect x="40" y="36" width="4" height="4" opacity=".8"/>
    <rect x="268" y="54" width="4" height="4" opacity=".8"/>
    <rect x="74" y="126" width="3" height="3" opacity=".8"/>
    <rect x="248" y="132" width="3" height="3" opacity=".8"/>
  </g>
  <g class="beam" opacity=".7">
    <path d="M128 104h64l32 68H96z" fill="url(#beam-static)"/>
    <rect x="112" y="168" width="96" height="4" fill="#00e5ff" opacity=".16"/>
  </g>
  <g class="ufo">
    <g filter="url(#cyan-glow-static)" opacity=".35" fill="#00e5ff">
