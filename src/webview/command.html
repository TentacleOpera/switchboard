<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/icon-180.png">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{NONCE}}' 'self'; style-src 'unsafe-inline' 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-src 'self'; manifest-src 'self';">
    <link rel="stylesheet" href="{{XTERM_CSS_URI}}">
    <link rel="stylesheet" href="/static/webview/statusCards.css">
    <title>Switchboard Command</title>
    <style>
        @font-face {
            font-family: 'Hanken Grotesk';
            src: url('{{HANKEN_FONT_URI}}') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'GeistPixel';
            src: url('{{GEIST_PIXEL_FONT_URI}}') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        :root {
            /* The site's green-black field (--background #101414), shared with
               the dock so the Agent panel is one instrument on both surfaces. */
            --bg-color: #101414;
            --panel-bg: #0b0f0f;
            --panel-bg2: #141818;
            --border-color: #333333;
            --border-bright: #444444;
            --text-primary: #e0e0e0;
            --text-secondary: #8C8C8C;
            --accent-primary: #00e5ff;
            --accent-teal: var(--accent-primary);
            --accent-teal-dim: color-mix(in srgb, var(--accent-teal) 40%, transparent);
            --accent-green: #4caf50;
            --accent-red: #f44336;
            --accent-amber: #ff9800;
            /* Semantic state colours for structured cards (statusCards.css).
               The design-system names, shared by the card's state chips so a
               `blocked` / `finished` / `question` reads as a state, never as the
               brand accent. */
            --error:   #ff4747;
            --warning: #ffb800;
            --success: #3ef06d;
            --font-family: 'Hanken Grotesk', Menlo, Consolas, sans-serif;
            --font-code: Menlo, Consolas, monospace;
            /* Instrument chrome, from the site's outline tokens. */
            --panel-line: #1d2323;
            --panel-edge: #363a3a;
            --term-grid: rgba(0, 229, 255, 0.03);
            --term-grid-size: 32px;
        }

        /* Setup lives at the FOOT of the pane, below the readout, and is never
           squeezed out of view — it holds the model config, which is the only
           way to fix an unconfigured station. Only the readout flexes. */
        .agent-setup-foot {
            margin-top: auto;
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .agent-pane-body {
            display: flex;
            flex-direction: column;
            gap: 9px;
            width: 100%;
            height: 100%;
            min-height: 0;
        }
        /* ── AGENT PANEL SKIN ────────────────────────────────────────────────
           Byte-for-byte the block in dock.html. The panel is one instrument on
           two surfaces; forking the skin is how they end up two. */
        /* ── CREW ────────────────────────────────────────────────────────────
           Two stations flying one mission, side by side, because that is what
           this product is: two models and a board between them, not one
           orchestrator driving agents. Each station is an annunciator tile —
           DARK until its circuit closes. That idea was already named in the
           code and then drawn as a 9px grey dot beside ordinary text; here the
           tile itself is the lamp.

           No typeface does any of this work. `correct-font-role-assignment`
           confines monospace to content where columns align, so the panel is
           Hanken like the rest of the UI, and the instrument reads as one
           through form, colour and lamp state. --font-code appears exactly
           once below, on stacked numerics, which is the allowlist's own case. */
        .agent-models {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }
        .crew-station {
            flex: 1 1 0;
            min-width: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 9px 10px 10px;
            background: linear-gradient(180deg, var(--panel-bg2), var(--panel-bg));
            border: 1px solid var(--panel-line);
            border-radius: 2px;
        }
        /* Corner brackets — the track-box the fleet scope draws around every
           contact. Two corners, not four: enough to read as a bracket without
           turning a 200px tile into a picture frame. */
        .crew-station::before,
        .crew-station::after {
            content: '';
            position: absolute;
            width: 7px;
            height: 7px;
            border: 1px solid var(--panel-edge);
            pointer-events: none;
        }
        .crew-station::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
        .crew-station::after  { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
        .crew-station.is-lit { border-color: color-mix(in srgb, var(--accent-primary) 45%, transparent); }
        .crew-station.is-lit::before,
        .crew-station.is-lit::after { border-color: var(--accent-primary); }
        .crew-head { display: flex; align-items: center; gap: 6px; }
        /* The role's own aircraft — the same pixel jet the scope tags its
           contacts with, and the same file the board rail uses. */
        .crew-jet {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            image-rendering: pixelated;
            opacity: 0.3;
        }
        .crew-station.is-lit .crew-jet { opacity: 1; }
        .crew-role {
            font-size: 9px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* The state word IS the lamp. An annunciator does not put a dot beside
           a label; the legend lights up. */
        .crew-state {
            font-size: 15px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.08em;
            color: var(--text-dim);
        }
        .crew-station.is-lit .crew-state {
            color: var(--accent-primary);
            text-shadow: 0 0 12px color-mix(in srgb, var(--accent-primary) 55%, transparent);
        }
        .crew-model {
            font-size: 11px;
            line-height: 1.3;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .crew-station.is-dark .crew-model { color: var(--text-dim); }
        /* A measure, not a sentence — and the one place on this panel where
           monospace earns itself: used/limit is a stacked numeric. */
        .crew-readout {
            font-family: var(--font-code);
            font-size: 10px;
            letter-spacing: 0.04em;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .crew-readout.is-near { color: var(--warning); }
        .crew-readout.is-over { color: var(--error); }
        /* The arm switch lives IN the station it arms. It used to sit three
           blocks down, past a config disclosure — which is the only reason the
           annunciator had to carry a caption telling you where the button was. */
        .crew-switch {
            margin-top: auto;
            align-self: flex-start;
            background: var(--bg-color);
            border: 1px solid var(--panel-edge);
            border-radius: 2px;
            color: var(--text-secondary);
            font-family: var(--font-family);
            font-size: 9px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 4px 9px;
            cursor: pointer;
        }
        .crew-switch:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .crew-switch[disabled] { opacity: 0.45; cursor: not-allowed; }
        /* Transient only: what the last control did. Steady state belongs to the
           station, so this line is empty most of the time. */
        .agent-poll {
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 12px;
        }
        /* ── READOUT ─────────────────────────────────────────────────────────
           IT SCROLLS. It did not, and the pane above it is overflow:hidden, so
           picking a team rendered a 6,388px card into a 711px box: roughly
           5,700px of it was unreachable, and what did render painted over the
           channel bar and the status line. On the phone the same clip cut the
           panel's one primary action, "Start mission", in half. */
        .agent-poll-report {
            /* Sized to its own content, shrinking (and scrolling) only when the
               content is taller than the pane. `flex: 1 1 auto` forced it to the
               full height whatever it held, which is where the 380px of dead
               space under a short readout came from. */
            flex: 0 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding-right: 2px;
        }
        /* ── CHANNELS ────────────────────────────────────────────────────────
           Above the readout they scope, not stranded at the foot of the pane
           beneath 380px of dead space. They select a SOURCE — the controller's
           board report, or one team's own seat reports — so they are channels,
           not a filter over one feed. */
        .agent-report-teams {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--panel-line);
        }
        .agent-channel-btn {
            background: transparent;
            border: 1px solid var(--panel-line);
            border-radius: 2px;
            color: var(--text-dim);
            font-family: var(--font-family);
            font-size: 9px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 4px 8px;
            cursor: pointer;
        }
        .agent-channel-btn:hover { color: var(--text-primary); border-color: var(--panel-edge); }
        .agent-channel-btn.is-active {
            color: var(--accent-primary);
            border-color: color-mix(in srgb, var(--accent-primary) 55%, transparent);
            background: color-mix(in srgb, var(--accent-primary) 8%, transparent);
        }

        /* ── ANNUNCIATOR ─────────────────────────────────────────────────────
           The verdict, on the scope's own field: the grid the dock already
           defines for the terminal viewport, and a scanline over it. The panel
           used a plain rounded rect with a 1px grey border, which is the
           default shape of every dark admin tool. */
        .ann {
            position: relative;
            padding: 15px 14px 13px;
            border: 1px solid var(--panel-line);
            border-radius: 2px;
            background-color: var(--panel-bg);
            background-image:
                repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px),
                linear-gradient(var(--term-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--term-grid) 1px, transparent 1px);
            background-size: auto, var(--term-grid-size) var(--term-grid-size),
                             var(--term-grid-size) var(--term-grid-size);
            overflow: hidden;
        }
        .ann::before,
        .ann::after {
            content: '';
            position: absolute;
            width: 9px;
            height: 9px;
            border: 1px solid var(--panel-edge);
            pointer-events: none;
        }
        .ann::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
        .ann::after  { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
        .ann-word {
            font-size: 23px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.07em;
        }
        .ann-caption {
            font-size: 12.5px;
            line-height: 1.45;
            margin-top: 8px;
            color: var(--text-primary);
        }
        /* Engraved sub-label: small caps, wide tracking, dim. The panel's own
           convention, now with a token behind its colour. */
        .stencil {
            font-size: 9px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        /* ── SYSTEMS CHECK ───────────────────────────────────────────────────
           The pre-flight list, read one line at a time: a lamp, the system, and
           the single fact that decides it. */
        .sys-row {
            display: flex;
            align-items: baseline;
            gap: 9px;
            padding: 6px 2px;
            border-bottom: 1px solid color-mix(in srgb, var(--panel-line) 70%, transparent);
        }
        .sys-lamp {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
            position: relative;
            top: -2px;
        }
        .sys-name { min-width: 74px; flex-shrink: 0; }
        .sys-fact { font-size: 12px; line-height: 1.4; }

        /* ── MISSION STRIPS ──────────────────────────────────────────────────
           What the crew is flying. */
        .mission-strip {
            padding: 10px 2px;
            border-bottom: 1px solid color-mix(in srgb, var(--panel-line) 70%, transparent);
        }
        .mission-name { font-size: 12.5px; line-height: 1.35; color: var(--text-primary); }
        .mission-track {
            height: 3px;
            border-radius: 2px;
            margin-top: 7px;
            background: var(--panel-line);
            overflow: hidden;
        }
        .mission-fill { height: 100%; background: var(--accent-primary); }

        /* ── SEAT REPORTS ────────────────────────────────────────────────────
           The scoped channel was an undesigned dump: 400-word entries at full
           body size, no state, no clamp. A seat's word is a report — it has a
           sender, a kind and a time. */
        .seat-report {
            padding: 9px 2px;
            border-bottom: 1px solid color-mix(in srgb, var(--panel-line) 70%, transparent);
        }
        .seat-head {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .seat-from { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .seat-kind {
            flex-shrink: 0;
            border: 1px solid currentColor;
            border-radius: 2px;
            padding: 1px 5px;
            font-size: 8px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .seat-when { flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .seat-body {
            font-size: 12px;
            line-height: 1.45;
            color: var(--text-primary);
            word-break: break-word;
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 4;
        }
        .seat-report.is-open .seat-body { -webkit-line-clamp: unset; }
        .seat-more {
            background: none;
            border: 0;
            padding: 3px 0 0;
            cursor: pointer;
            font-family: var(--font-family);
            font-size: 9px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-primary);
        }

        body.cyber-theme-enabled { }

        body.theme-claudify {
            --accent-primary: #D97757;
            --accent-teal: #D97757;
            --accent-teal-dim: color-mix(in srgb, #D97757 40%, transparent);
            --text-secondary: #8C8C8C;
            --border-color: #333333;
            --border-bright: #444444;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            overflow: hidden;
            touch-action: manipulation;
        }

        #app-root {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Top Header */
        .cmd-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 14px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 48px;
        }

        .cmd-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            flex-shrink: 0;
        }

        .cmd-logo {
            font-family: 'GeistPixel', var(--font-code);
            font-size: 13px;
            color: var(--accent-primary);
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .workspace-project-select {
            flex: 1;
            min-width: 140px;
            max-width: 320px;
            background: transparent;
            color: var(--text-primary);
            border: none;
            border-bottom: 1px solid var(--border-color);
            border-radius: 0;
            padding: 6px 4px;
            font-family: var(--font-family);
            font-size: 12px;
            min-height: 38px;
            outline: none;
        }

        .workspace-project-select:focus {
            border-bottom-color: var(--accent-primary);
        }

        /* Mission in-flight lock banner */
        .mission-lock-banner {
            background: rgba(255, 152, 0, 0.12);
            border-bottom: 1px solid var(--accent-amber);
            color: var(--accent-amber);
            padding: 6px 14px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-shrink: 0;
        }

        .mission-lock-banner.hidden {
            display: none;
        }

        /* Main Content Layout */
        .cmd-main-container {
            display: flex;
            flex: 1;
            min-height: 0;
            position: relative;
        }

        .tablet-rail {
            display: none;
            width: 300px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            flex-direction: column;
            padding: 12px;
            gap: 6px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .tablet-rail-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }

        .tablet-rail .nav-btn {
            justify-content: flex-start;
            padding: 10px 14px;
            border-radius: 2px;
            gap: 8px;
            border-top: none;
        }

        .tablet-rail .nav-btn .nav-mark {
            top: 0;
            bottom: 0;
            left: 0;
            right: auto;
            width: 2px;
            height: 100%;
        }

        .tablet-rail-divider {
            width: 100%;
            height: 1px;
            background: var(--border-color);
            margin: 10px 0 6px 0;
        }

        .tablet-rail-teams-header {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 1px;
            padding: 4px 6px;
            text-transform: uppercase;
        }

        .tablet-rail-teams-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .cmd-view-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .cmd-view-pane {
            display: none;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            height: 100%;
            padding: 12px;
            overflow: hidden;
        }

        .cmd-view-pane.active {
            display: flex;
        }

        /* Bottom Nav (Phone) */
        .phone-nav-bar {
            display: flex;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 52px;
        }

        .nav-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-family);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 8px;
            min-height: 48px;
            transition: color 0.15s, background 0.15s;
        }

        .nav-btn:hover, .nav-btn:active {
            color: var(--text-primary);
        }

        .nav-btn.active {
            color: var(--accent-primary);
            background: rgba(0, 229, 255, 0.06);
        }

        .nav-btn .nav-mark {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-primary);
        }

        .nav-btn.active .nav-mark {
            display: block;
        }

        /* Card List Styles */
        .list-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .star-filter-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--panel-bg2);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 2px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            min-height: 44px;
        }

        .star-filter-btn.active {
            border-color: var(--accent-amber);
            color: var(--accent-amber);
            background: rgba(255, 152, 0, 0.1);
        }

        .cards-scroll-list {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            background: var(--panel-bg);
        }

        .cmd-card-row {
            min-height: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            border-bottom: 1px solid var(--border-color);
            background: transparent;
            cursor: pointer;
            transition: background 0.1s;
            flex-shrink: 0;
        }

        .cmd-card-row:last-child {
            border-bottom: none;
        }

        .cmd-card-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .cmd-card-row.selected {
            background: rgba(0, 229, 255, 0.08);
        }

        .card-star-indicator {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--border-bright);
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .card-star-indicator.starred {
            color: var(--accent-amber);
        }

        .cmd-card-title {
            flex: 1;
            min-width: 0;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cmd-card-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .complexity-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            font-family: var(--font-code);
            color: #000;
            flex-shrink: 0;
        }

        .comp-very-low { background: #4caf50; }
        .comp-low { background: #8bc34a; }
        .comp-medium { background: #ffeb3b; }
        .comp-high { background: #ff9800; }
        .comp-very-high { background: #f44336; color: #fff; }
        .comp-unknown { background: #555555; }

        .subtask-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            font-family: var(--font-code);
            white-space: nowrap;
        }

        .kind-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 2px;
            background: var(--panel-bg2);
            border: 1px solid var(--border-color);
            color: var(--accent-primary);
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* Action Anchors / Action Panels */
        .cmd-action-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            flex-shrink: 0;
        }

        .action-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cmd-select {
            background: var(--panel-bg2);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            padding: 8px 10px;
            font-size: 13px;
            font-family: var(--font-family);
            min-height: 44px;
            flex: 1;
            outline: none;
        }

        .cmd-select:focus {
            border-color: var(--accent-primary);
        }

        .primary-action-btn {
            background: rgba(0, 229, 255, 0.08);
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            border-radius: 2px;
            font-family: var(--font-family);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 10px 16px;
            cursor: pointer;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            transition: background 0.15s, opacity 0.15s;
        }

        .primary-action-btn:hover:not(:disabled) {
            background: rgba(0, 229, 255, 0.16);
        }

        .primary-action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border-color);
            color: var(--text-secondary);
            background: transparent;
        }

        .secondary-action-btn {
            background: var(--panel-bg2);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            font-family: var(--font-family);
            font-size: 12px;
            font-weight: 600;
            padding: 10px 14px;
            cursor: pointer;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .secondary-action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .status-chip {
            font-size: 11px;
            font-family: var(--font-code);
            padding: 4px 8px;
            border-radius: 2px;
            background: var(--panel-bg2);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .status-chip.hidden {
            display: none;
        }

        .status-chip.success {
            color: var(--accent-green);
            border-color: var(--accent-green);
            background: rgba(76, 175, 80, 0.1);
        }

        .status-chip.pending {
            color: var(--accent-primary);
            border-color: var(--accent-primary);
            background: rgba(0, 229, 255, 0.1);
        }

        .status-chip.unknown {
            color: var(--accent-amber);
            border-color: var(--accent-amber);
            background: rgba(255, 152, 0, 0.1);
        }

        .status-chip.error {
            color: var(--accent-red);
            border-color: var(--accent-red);
            background: rgba(244, 67, 54, 0.1);
        }

        /* The board-move trigger gate state — read-only indicator so the
           operator can see the setting that silences board drag/move
           gestures without leaving this surface. */
        .dispatch-trigger-state {
            font-size: 10px;
            font-family: var(--font-code);
            color: var(--text-secondary);
            text-align: center;
            margin-top: 6px;
            opacity: 0.85;
        }

        /* Teams View */
        .teams-roster-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            overflow-y: auto;
        }

        /* The card STACKS: a head line, then one row per live seat. It used to
           be the head line itself (a flex row), which laid the seat rows out
           beside the icon and the state badge instead of under them. Padding
           and min-height moved onto .team-roster-headline so the seat rows sit
           flush against the card edge. */
        .team-roster-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            cursor: pointer;
        }

        .team-roster-headline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            min-height: 52px;
        }

        .team-roster-card.is-dormant {
            opacity: 0.55;
            border-style: dashed;
        }

        .team-roster-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .team-icon-box {
            width: 28px;
            height: 28px;
            border-radius: 2px;
            background: var(--panel-bg2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-primary);
            flex-shrink: 0;
            overflow: hidden;
        }

        .team-icon-img {
            width: 22px;
            height: 22px;
            image-rendering: pixelated;
        }

        .team-info-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .team-name-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .team-seats-subtitle {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .team-state-badge {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 2px;
            letter-spacing: 0.5px;
            font-family: var(--font-code);
        }

        .team-state-working {
            background: rgba(76, 175, 80, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .team-state-idle {
            background: var(--panel-bg2);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .team-state-dormant {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .team-state-held {
            background: rgba(255, 152, 0, 0.15);
            color: var(--accent-amber);
            border: 1px solid var(--accent-amber);
        }

        /* Terminal Viewer (interactive — xterm + mobile key bar) */
        .terminal-viewer-pane {
            display: none;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            background: var(--panel-bg);
            border-radius: 2px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .terminal-viewer-pane.active {
            display: flex;
        }

        .terminal-viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 12px;
            background: var(--panel-bg2);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 44px;
        }

        /* xterm host container. The viewport module appends its own .xterm
         * element inside this; the container only provides the box the
         * ResizeObserver measures. flex:1 + min-height:0 lets it fill the
         * space between the header and the key bar without overflowing. */
        .terminal-xterm-host {
            flex: 1;
            min-height: 0;
            background: #050505;
            position: relative;
            overflow: hidden;
        }
        .terminal-xterm-host .terminal-view-host {
            position: absolute;
            inset: 0;
        }

        /* Mobile key bar. Hidden on fine-pointer (desktop) viewports; the key
         * bar module toggles .sb-keybar-hidden / .sb-keybar-visible based on
         * the (pointer: coarse) media query. The bar is fixed at the bottom
         * of the viewer pane so it never scrolls out of reach. */
        .sb-keybar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 6px 8px;
            background: var(--panel-bg2);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
            justify-content: center;
        }
        .sb-keybar.sb-keybar-hidden {
            display: none;
        }
        .sb-keybar-btn {
            font-family: var(--font-code);
            font-size: 13px;
            line-height: 1;
            padding: 10px 12px;
            min-width: 40px;
            min-height: 40px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--panel-bg);
            color: var(--text-primary);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }
        .sb-keybar-btn-wide {
            min-width: 64px;
        }
        .sb-keybar-btn.sb-keybar-armed {
            background: var(--accent-primary, #4a9eff);
            color: #fff;
            border-color: var(--accent-primary, #4a9eff);
        }

        /* VIEW Overlay */
        .cmd-view-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-color);
            z-index: 50;
            display: none;
            flex-direction: column;
        }

        .cmd-view-overlay.active {
            display: flex;
        }

        .view-overlay-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 14px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            min-height: 48px;
            flex-shrink: 0;
        }

        .view-overlay-path {
            font-family: var(--font-code);
            font-size: 11px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        /* The composer moved to the agent dock (dock.html / dockComposer.js);
           its modal styles left with the markup. */

        .view-overlay-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        #kanban-preview-content {
            color: var(--text-primary);
            font-size: 13px;
            line-height: 1.6;
        }

        #kanban-preview-content h1, #kanban-preview-content h2, #kanban-preview-content h3 {
            color: var(--accent-primary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            margin-top: 14px;
            margin-bottom: 8px;
        }

        #kanban-preview-content pre {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 2px;
            overflow-x: auto;
            font-family: var(--font-code);
            font-size: 11px;
        }

        #kanban-preview-content code {
            font-family: var(--font-code);
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 4px;
            border-radius: 2px;
        }

        /* ── Breakpoint 1: Medium Screens (min-width: 600px) ── */
        @media (min-width: 600px) {
            .cmd-header {
                padding: 10px 20px;
            }
            .cmd-view-pane {
                padding: 16px;
            }
        }

        /* ── Breakpoint 2: Tablet Landscape & Desktop (min-width: 900px) ── */
        @media (min-width: 900px) {
            .phone-nav-bar {
                display: none;
            }
            .tablet-rail {
                display: flex;
            }
            .cmd-view-pane {
                padding: 20px;
            }
        }
    </style>
</head>
<body class="is-solo">
    <div id="app-root">
        <!-- Top Header -->
        <header class="cmd-header">
            <div class="cmd-header-left">
                <!-- No logo and no live dot. The product name told the operator
                     nothing they did not know and cost a whole bar of height on a
                     phone; the project picker now occupies that place. -->
                <select id="workspace-project-select" class="workspace-project-select" aria-label="Select workspace and project"></select>
            </div>
        </header>

        <!-- Mission Lock Banner -->
        <div id="mission-lock-banner" class="mission-lock-banner hidden">
            <span>Mission in flight: <strong id="lock-mission-codename"></strong>. Card actions locked.</span>
        </div>

        <div class="cmd-main-container">
            <!-- Tablet Left Rail -->
            <nav class="tablet-rail" id="tablet-rail" aria-label="Navigation Rail">
                <div class="tablet-rail-section">
                    <button class="nav-btn active" data-view="dispatch" title="Dispatch">
                        <span class="nav-mark"></span>
                        <span class="nav-label">Dispatch</span>
                    </button>
                    <button class="nav-btn" data-view="move" title="Move">
                        <span class="nav-mark"></span>
                        <span class="nav-label">Move</span>
                    </button>
                    <button class="nav-btn" data-view="mission" title="Mission">
                        <span class="nav-mark"></span>
                        <span class="nav-label">Mission</span>
                    </button>
                    <button class="nav-btn" data-view="teams" title="Teams">
                        <span class="nav-mark"></span>
                        <span class="nav-label">Teams</span>
                    </button>
                    <button class="nav-btn" data-view="agent" title="Agent">
                        <span class="nav-mark"></span>
                        <span class="nav-label">Agent</span>
                    </button>
                </div>
                <div class="tablet-rail-divider"></div>
                <div class="tablet-rail-teams-header">TEAMS</div>
                <div class="tablet-rail-teams-list" id="tablet-teams-rail">
                    <!-- Team items inserted here -->
                </div>
            </nav>

            <!-- Active View Container -->
            <main class="cmd-view-container">
                <!-- 1. Dispatch View -->
                <section class="cmd-view-pane active" id="view-dispatch">
                    <div class="list-header-row">
                        <select class="cmd-select" id="dispatch-source-column-select" style="max-width:200px;" aria-label="Show cards from column"></select>
                        <button class="star-filter-btn" id="dispatch-star-toggle">
                            <span class="star-filter-icon" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5l2 4.5 5 .4-3.8 3.3 1.2 4.9L8 12l-4.4 2.6 1.2-4.9L1 6.4l5-.4z"/></svg></span>
                            <span>Starred only</span>
                        </button>
                        <button class="secondary-action-btn" id="btn-composer" title="Compose a prompt and send it to any terminal">COMPOSER</button>
                    </div>
                    <div class="cards-scroll-list" id="dispatch-cards-list">
                        <!-- Cards populated by script -->
                    </div>

                    <div class="cmd-action-box" id="dispatch-action-box">
                        <div id="dispatch-status-chip" class="status-chip hidden"></div>
                        <div class="action-row">
                            <button class="secondary-action-btn" id="btn-dispatch-view" disabled>VIEW</button>
                            <button class="primary-action-btn" id="btn-dispatch" disabled>DISPATCH</button>
                        </div>
                        <div id="dispatch-trigger-state" class="dispatch-trigger-state" title="kanban.boardMoveCliTriggersEnabled — gates board drag/move gestures only; DISPATCH always fires.">board-move triggers: …</div>
                    </div>
                </section>

                <!-- 2. Move View -->
                <section class="cmd-view-pane" id="view-move">
                    <div class="list-header-row">
                        <select class="cmd-select" id="move-source-column-select" style="max-width:200px;" aria-label="Source Column"></select>
                        <button class="star-filter-btn" id="move-star-toggle">
                            <span class="star-filter-icon" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5l2 4.5 5 .4-3.8 3.3 1.2 4.9L8 12l-4.4 2.6 1.2-4.9L1 6.4l5-.4z"/></svg></span>
                            <span>Starred only</span>
                        </button>
                    </div>
                    <div class="cards-scroll-list" id="move-cards-list">
                        <!-- Move cards populated by script -->
                    </div>

                    <div class="cmd-action-box" id="move-action-box">
                        <div class="action-row">
                            <label for="move-target-column-select" style="font-size:12px; color:var(--text-secondary); white-space:nowrap;">To:</label>
                            <select class="cmd-select" id="move-target-column-select" aria-label="Target Column"></select>
                        </div>
                        <div id="move-status-chip" class="status-chip hidden"></div>
                        <div class="action-row">
                            <button class="secondary-action-btn" id="btn-move-view" disabled>VIEW</button>
                            <button class="primary-action-btn" id="btn-move" disabled>
                                MOVE
                            </button>
                        </div>
                    </div>
                </section>

                <!-- 3. Mission View -->
                <section class="cmd-view-pane" id="view-mission">
                    <div style="display:flex; flex-direction:column; gap:10px; width:100%; height:100%; min-height:0;">
                        <div class="list-header-row">
                            <span style="font-weight:700; font-size:13px; color:var(--text-primary); letter-spacing:0.5px;">MISSION</span>
                        </div>

                        <!-- State A: Mission selection → members → Launch -->
                        <div id="mission-staging-container" style="display:flex; flex-direction:column; flex:1; min-height:0; gap:8px;">
                            <div class="action-row">
                                <select class="cmd-select" id="mission-select" aria-label="Select Mission"></select>
                            </div>
                            <div class="cards-scroll-list" id="mission-members-list">
                                <!-- Selected mission's members (read-only) -->
                            </div>
                            <div class="cmd-action-box">
                                <div id="mission-status-chip" class="status-chip hidden"></div>
                                <div class="action-row">
                                    <button class="primary-action-btn" id="btn-launch-mission" disabled>
                                        LAUNCH MISSION
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- State B: In-Flight Progress -->
                        <div id="mission-progress-container" class="hidden" style="display:flex; flex-direction:column; flex:1; min-height:0; gap:8px;">
                            <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 0;">
                                <span id="mission-progress-codename" style="font-size:14px; font-weight:700; color:var(--accent-primary);">MISSION ACTIVE</span>
                                <span class="team-state-badge team-state-held" id="mission-progress-badge">IN FLIGHT</span>
                            </div>
                            <div id="mission-progress-elapsed" style="font-size:12px; color:var(--text-secondary); font-family:var(--font-code);">Running</div>
                            <div class="cards-scroll-list" id="mission-progress-members-list">
                                <!-- Live status of members -->
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 4. Teams View (Phone Roster) -->
                <section class="cmd-view-pane" id="view-teams">
                    <div style="display:flex; flex-direction:column; gap:10px; width:100%; height:100%; min-height:0;">
                        <div class="list-header-row">
                            <span style="font-weight:700; font-size:13px; color:var(--text-primary); letter-spacing:0.5px;">TEAM ROSTER</span>
                        </div>
                        <div id="teams-notice" class="status-chip unknown hidden"></div>
                        <div class="teams-roster-list" id="teams-roster-list">
                            <!-- Team cards populated by script -->
                        </div>
                    </div>
                </section>

                <!-- 5. Agent View (Control Surface — no terminal, phone-safe) -->
                <section class="cmd-view-pane" id="view-agent">
                    <!-- ORDER IS THE DESIGN, and it matches dock.html exactly:
                         crew, then what the last control did, then the channel
                         being watched, then the readout — the only part that
                         scrolls. Setup is demoted to the foot; it used to sit
                         between the Pilot station and the switch that arms it. -->
                    <div class="agent-pane-body">
                        <!-- Two stations flying one mission. The arm switch is
                             rendered INTO the Pilot station by command.js. -->
                        <div class="agent-models" id="agent-models"></div>
                        <div class="agent-poll" id="agent-poll">
                            <button type="button" class="secondary-action-btn" id="agent-poll-start" hidden>Arm watch</button>
                            <button type="button" class="secondary-action-btn" id="agent-poll-stop" hidden>Stop watch</button>
                            <span class="agent-poll-state" id="agent-poll-state"></span>
                        </div>
                        <div class="agent-report-teams" id="agent-report-teams"></div>
                        <div class="agent-poll-report" id="agent-poll-report"></div>
                        <div class="agent-setup-foot">
                            <div id="agent-status-chip" class="status-chip hidden"></div>
                            <div id="agent-quick-actions" style="display:flex; flex-wrap:wrap; gap:4px;"></div>
                            <!-- TWO BLOCKS, TWO ROLE POINTERS. The Pilot block
                                 posts /agent/control/config; the Navigator block
                                 posts /controller/navigator. They read and write
                                 DISJOINT pointers over a SHARED provider rows
                                 map, so saving one never clears the other. The
                                 Navigator is NOT the model the Pilot escalates
                                 to — it has a different job. -->
                            <details style="border:1px solid var(--border-color); border-radius:4px; background:var(--panel-bg);">
                        <summary style="cursor:pointer; list-style:none; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); padding:7px 10px; user-select:none;">Pilot model</summary>
                        <div style="display:flex; flex-direction:column; gap:5px; padding:6px;">
                            <label for="agent-control-provider" style="font-size:10px; color:var(--text-dim); text-transform:uppercase;">Provider</label>
                            <select id="agent-control-provider" style="background:var(--panel-bg2); border:1px solid var(--border-color); border-radius:4px; color:var(--text-primary); font-family:var(--font-code); font-size:11px; padding:6px 8px; outline:none;"></select>
                            <!-- Endpoint: only for providers that do not carry a
                                 fixed URL (local server, custom endpoint). -->
                            <label for="agent-control-endpoint" id="agent-control-endpoint-label" style="font-size:10px; color:var(--text-dim); text-transform:uppercase;">Server URL</label>
                            <input type="text" id="agent-control-endpoint" placeholder="http://… (unset)" style="background:var(--panel-bg2); border:1px solid var(--border-color); border-radius:4px; color:var(--text-primary); font-family:var(--font-code); font-size:11px; padding:6px 8px; outline:none;" />
                            <!-- Model: a dropdown of the provider's models, a
                                 free-text name, or neither (local server names
                                 its own). Both controls carry the same label. -->
                            <label for="agent-control-model-select" id="agent-control-model-label" style="font-size:10px; color:var(--text-dim); text-transform:uppercase;">Model</label>
                            <select id="agent-control-model-select" style="background:var(--panel-bg2); border:1px solid var(--border-color); border-radius:4px; color:var(--text-primary); font-family:var(--font-code); font-size:11px; padding:6px 8px; outline:none;"></select>
                            <input type="text" id="agent-control-model" placeholder="model name" style="background:var(--panel-bg2); border:1px solid var(--border-color); border-radius:4px; color:var(--text-primary); font-family:var(--font-code); font-size:11px; padding:6px 8px; outline:none;" />
                            <label for="agent-control-key" id="agent-control-key-label" style="font-size:10px; color:var(--text-dim); text-transform:uppercase;">API key</label>
                            <input type="password" id="agent-control-key" placeholder="(unset)" autocomplete="off" style="background:var(--panel-bg2); border:1px solid var(--border-color); border-radius:4px; color:var(--text-primary); font-family:var(--font-code); font-size:11px; padding:6px 8px; outline:none;" />
                            <button class="secondary-action-btn" id="btn-agent-config-save" style="align-self:flex-end; padding:6px 14px;">Save config</button>
                            <div id="agent-control-config-status" style="font-size:10px; color:var(--text-dim);"></div>
                        </div>
                        </details>
                            <details id="agent-navigator-config-wrap" style="border:1px solid var(--border-color); border-radius:4px; background:var(--panel-bg);">
                        <summary style="cursor:pointer; list-style:none; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); padding:7px 10px; user-select:none;">Navigator model</summary>
                        <div style="display:flex; flex-direction:column; gap:5px; padding:6px;">
                            <label for="agent-navigator-provider" style="font-size:10px; color:var(--text-dim); text-transform:uppercase;">Provider</label>
                            <select id="agent-navigator-provider" style="background:var(--panel-bg2); border:1px solid var(--border-color); border-radius:4px; color:var(--text-primary); font-family:var(--font-code); font-size:11px; padding:6px 8px; outline:none;"></select>
                            <label for="agent-navigator-endpoint" id="agent-navigator-endpoint-label" style="font-size:10px; color:var(--text-dim); text-transform:uppercase;">Server URL</label>
                            <input type="text" id="agent-navigator-endpoint" placeholder="http://… (unset)" style="background:var(--panel-bg2); border:1px solid var(--border-color); border-radius:4px; color:var(--text-primary); font-family:var(--font-code); font-size:11px; padding:6px 8px; outline:none;" />
                            <label for="agent-navigator-model-select" id="agent-navigator-model-label" style="font-size:10px; color:var(--text-dim); text-transform:uppercase;">Model</label>
                            <select id="agent-navigator-model-select" style="background:var(--panel-bg2); border:1px solid var(--border-color); border-radius:4px; color:var(--text-primary); font-family:var(--font-code); font-size:11px; padding:6px 8px; outline:none;"></select>
                            <input type="text" id="agent-navigator-model" placeholder="model name" style="background:var(--panel-bg2); border:1px solid var(--border-color); border-radius:4px; color:var(--text-primary); font-family:var(--font-code); font-size:11px; padding:6px 8px; outline:none;" />
                            <label for="agent-navigator-key" id="agent-navigator-key-label" style="font-size:10px; color:var(--text-dim); text-transform:uppercase;">API key</label>
                            <input type="password" id="agent-navigator-key" placeholder="(unset)" autocomplete="off" style="background:var(--panel-bg2); border:1px solid var(--border-color); border-radius:4px; color:var(--text-primary); font-family:var(--font-code); font-size:11px; padding:6px 8px; outline:none;" />
                            <button class="secondary-action-btn" id="btn-agent-navigator-config-save" style="align-self:flex-end; padding:6px 14px;">Save config</button>
                            <div id="agent-navigator-config-status" style="font-size:10px; color:var(--text-dim);"></div>
                        </div>
                        </details>
                        </div>
                    </div>
                </section>

                <!-- Interactive Terminal Viewer Pane (xterm + mobile key bar) -->
                <section class="terminal-viewer-pane" id="pane-terminal-viewer">
                    <div class="terminal-viewer-header">
                        <button class="secondary-action-btn" id="btn-close-terminal">&larr; Back to Teams</button>
                        <span id="terminal-viewer-title" style="font-size:12px; font-weight:600; color:var(--text-primary);">Terminal Output</span>
                        <span class="status-chip" id="terminal-ws-status">Live</span>
                    </div>
                    <div id="terminal-seat-switcher" style="display:none;flex-wrap:wrap;gap:4px;padding:4px 8px;background:var(--panel-bg2);border-bottom:1px solid var(--border-color);"></div>
                    <!-- xterm host. The viewport module appends its own container here. -->
                    <div class="terminal-xterm-host" id="terminal-xterm-host"></div>
                    <!-- Mobile key bar. Hidden on fine-pointer viewports; the key bar
                         module toggles visibility based on (pointer: coarse). -->
                    <div id="terminal-key-bar"></div>
                </section>

                <!-- VIEW Document Preview Overlay -->
                <div class="cmd-view-overlay" id="view-overlay">
                    <div class="view-overlay-header">
                        <button class="secondary-action-btn" id="btn-close-preview">&larr; Back</button>
                        <span class="view-overlay-path" id="preview-file-path"></span>
                    </div>
                    <div class="view-overlay-body">
                        <div id="kanban-preview-content"></div>
                    </div>
                </div>

                <!-- The composer is a standing tab in the agent dock now
                     (dock.html / dockComposer.js), not a modal in this
                     document — the COMPOSER button posts openDockTab to the
                     shell. -->
            </main>
        </div>

        <!-- Bottom Sub-Nav Bar (Phone) -->
        <nav class="phone-nav-bar" id="phone-nav-bar" aria-label="Mobile Navigation">
            <button class="nav-btn active" data-view="dispatch">
                <span class="nav-mark"></span>
                <span class="nav-label">Dispatch</span>
            </button>
            <button class="nav-btn" data-view="move">
                <span class="nav-mark"></span>
                <span class="nav-label">Move</span>
            </button>
            <button class="nav-btn" data-view="mission">
                <span class="nav-mark"></span>
                <span class="nav-label">Mission</span>
            </button>
            <button class="nav-btn" data-view="teams">
                <span class="nav-mark"></span>
                <span class="nav-label">Teams</span>
            </button>
            <button class="nav-btn" data-view="agent">
                <span class="nav-mark"></span>
                <span class="nav-label">Agent</span>
            </button>
        </nav>
    </div>

    <!-- SHARED_DEFAULTS_SCRIPT -->
    <!-- `defer` on the terminal stack: terminalViewport.js and terminalKeyBar.js
         are not parser-blocking dependencies of command.js, but command.js
         reads window.SwitchboardTerminalViewport / window.SwitchboardTerminalKeyBar
         at viewer-open time, so they must be loaded before any viewer opens.
         defer keeps the download parallel and execution in document order. -->
    <script defer nonce="{{NONCE}}" src="/static/webview/sharedUtils.js"></script>
    <script defer nonce="{{NONCE}}" src="/static/webview/statusCards.js"></script>
    <script defer nonce="{{NONCE}}" src="/static/webview/terminalViewport.js"></script>
    <script defer nonce="{{NONCE}}" src="/static/webview/terminalKeyBar.js"></script>
    <script defer nonce="{{NONCE}}" src="/static/webview/command.js"></script>
</body>
</html>
