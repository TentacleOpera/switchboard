<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CSP mirrors terminals.html: the viewport needs ws: for the pty stream.
         Without connect-src ws: wss: the terminal connects to nothing, silently. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{NONCE}}' 'self'; style-src 'unsafe-inline' 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-src 'none';">
    <title>Dock</title>
    <link rel="stylesheet" href="{{XTERM_CSS_URI}}">
    <style>
        @font-face {
            font-family: 'Hanken Grotesk';
            src: url('{{HANKEN_FONT_URI}}') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #000000;
            --border-color: #333333;
            --border-bright: #444444;
            --text-primary: #e0e0e0;
            --text-dim: #8C8C8C;
            --accent-primary: #00e5ff;
            --accent-dim: rgba(0, 229, 255, 0.25);
            --font-family: 'Hanken Grotesk', Menlo, Consolas, sans-serif;
            --font-code:   Menlo, Consolas, monospace;
            --term-surface:   #171717;
            --term-grid:      rgba(0, 229, 255, 0.03);
            --term-grid-size: 32px;
            --term-selection: rgba(0, 229, 255, 0.3);
            --state-connecting: #d7a03a;
            --state-readonly:   #f85149;
        }
        body.theme-claudify {
            --accent-primary: #D97757;
            --accent-dim: rgba(217, 119, 87, 0.25);
            --term-grid: rgba(255, 255, 255, 0.03);
            --term-selection: rgba(217, 119, 87, 0.3);
        }
        body.cyber-theme-enabled,
        body.theme-claudify {
            background-color: var(--term-surface);
            background-image:
                linear-gradient(var(--term-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--term-grid) 1px, transparent 1px);
            background-size: var(--term-grid-size) var(--term-grid-size),
                             var(--term-grid-size) var(--term-grid-size);
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 12px;
            overflow: hidden;
        }
        /* ── Dock header: tab strip + title + restart + close ── */
        #dock-header {
            flex: 0 0 32px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 6px;
            border-bottom: 1px solid var(--border-color);
            background: var(--panel-bg);
        }
        #dock-tabs {
            display: flex;
            align-items: center;
            gap: 2px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 1px;
        }
        .dock-tab-btn {
            background: transparent;
            border: none;
            border-radius: 3px;
            color: var(--text-dim);
            font-family: var(--font-family);
            font-size: 11px;
            padding: 2px 8px;
            cursor: pointer;
        }
        .dock-tab-btn:hover { color: var(--text-primary); }
        .dock-tab-btn.is-active {
            background: var(--panel-bg);
            color: var(--text-primary);
        }
        #dock-title {
            flex: 1 1 auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-dim);
            font-size: 11px;
        }
        .dock-chip {
            background: var(--bg-color);
            border: 1px solid var(--accent-dim);
            border-radius: 3px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 11px;
            padding: 2px 8px;
            cursor: pointer;
        }
        .dock-chip:hover { background: var(--accent-dim); }
        .dock-icon-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 3px;
            color: var(--text-dim);
            font-size: 16px;
            line-height: 1;
            padding: 2px 6px;
            cursor: pointer;
        }
        .dock-icon-btn:hover { color: var(--text-primary); background: var(--bg-color); border-color: var(--border-color); }
        .dock-start-btn {
            background: var(--bg-color);
            border: 1px solid var(--accent-dim);
            border-radius: 3px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 11px;
            padding: 3px 10px;
            cursor: pointer;
        }
        .dock-start-btn:hover { background: var(--accent-dim); color: var(--text-primary); }
        .dock-start-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
        #dock-cli-wrap {
            display: none;
            align-items: center;
            gap: 4px;
        }
        #dock-cli-wrap.is-visible { display: flex; }
        #dock-cli-wrap .dock-cli-input {
            width: 120px;
            font-size: 11px;
            font-family: var(--font-code);
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            color: var(--text-primary);
            padding: 2px 6px;
        }
        #dock-cli-wrap .dock-cli-input:focus { border-color: var(--accent-primary); }
        /* ── Panes: one visible at a time ── */
        #dock-agent-pane,
        #dock-cli-pane {
            display: none;
            flex: 1 1 auto;
            background: var(--term-surface);
            overflow: hidden;
        }
        #dock-agent-pane.is-visible,
        #dock-cli-pane.is-visible { display: block; }
        /* ── Agent control surface ──────────────────────────────────────────
           The Agent tab is an API-backed control surface, not a pty seat.
           No terminal emulator — an input, a resolution log, quick-action
           buttons, and a status line. See plan:
           the-dock-agent-tab-is-a-control-surface-not-a-terminal. */
        #dock-agent-pane {
            display: none;
            flex: 1 1 auto;
            flex-direction: column;
            background: var(--bg-color);
            overflow: hidden;
        }
        #dock-agent-pane.is-visible { display: flex; }
        .agent-control-log {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 8px 10px;
            font-family: var(--font-code);
            font-size: 12px;
            line-height: 1.5;
            color: var(--text-primary);
        }
        .agent-control-entry {
            margin-bottom: 10px;
            padding: 6px 8px;
            border-radius: 4px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
        }
        .agent-control-entry.is-user {
            border-color: var(--accent-dim);
        }
        .agent-control-entry-role {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }
        .agent-control-entry-text {
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .agent-control-resolved {
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-dim);
        }
        .agent-control-resolved-card {
            display: inline-block;
            margin: 2px 4px 2px 0;
            padding: 1px 6px;
            border-radius: 3px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            font-size: 10px;
            color: var(--text-primary);
        }
        .agent-control-actions {
            margin-top: 4px;
            font-size: 11px;
            color: var(--accent-primary);
        }
        .agent-control-action-error {
            color: #f85149;
        }
        .agent-control-quickactions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 6px 10px;
            border-top: 1px solid var(--border-color);
            background: var(--panel-bg);
        }
        .agent-control-quickbtn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-dim);
            font-family: var(--font-family);
            font-size: 11px;
            padding: 3px 8px;
            cursor: pointer;
        }
        .agent-control-quickbtn:hover { color: var(--text-primary); border-color: var(--accent-dim); }
        .agent-control-input-row {
            display: flex;
            gap: 6px;
            padding: 8px 10px;
            border-top: 1px solid var(--border-color);
            background: var(--panel-bg);
        }
        .agent-control-input {
            flex: 1 1 auto;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: var(--font-code);
            font-size: 12px;
            padding: 6px 10px;
            outline: none;
            box-sizing: border-box;
        }
        .agent-control-input:focus { border-color: var(--accent-primary); }
        .agent-control-send {
            background: var(--accent-dim);
            border: 1px solid var(--accent-dim);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 12px;
            padding: 6px 14px;
            cursor: pointer;
        }
        .agent-control-send:hover { background: var(--accent-primary); color: var(--bg-color); }
        .agent-control-send[disabled] { opacity: 0.5; cursor: not-allowed; }
        .agent-control-status {
            padding: 4px 10px;
            font-size: 10px;
            color: var(--text-dim);
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
        }
        .agent-control-status.is-error { color: #f85149; }
        .agent-control-status.is-model { color: var(--accent-primary); }
        #dock-fleet {
            display: none;
            flex: 1 1 auto;
            flex-direction: column;
            overflow: auto;
            padding: 8px;
            gap: 6px;
        }
        #dock-fleet.is-visible { display: flex; }
        .dock-fleet-offline {
            color: var(--text-dim);
            font-size: 12px;
            padding: 16px;
            text-align: center;
        }
        .dock-fleet-table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--panel-bg);
        }
        .dock-fleet-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-code);
            font-size: 11px;
            line-height: 1.4;
        }
        .dock-fleet-table th,
        .dock-fleet-table td {
            text-align: left;
            padding: 6px 10px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }
        .dock-fleet-table th {
            color: var(--text-dim);
            font-weight: 600;
            background: var(--bg-color);
        }
        .dock-fleet-table tbody tr:last-child td { border-bottom: none; }
        .dock-fleet-table td:nth-child(4) {
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dock-fleet-status-active { color: var(--accent-primary); }
        .dock-fleet-status-exited { color: var(--text-dim); }
        .dock-hops-section {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            background: var(--panel-bg);
        }
        .dock-hop-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .dock-hop-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--text-primary);
        }
        .dock-hop-reason {
            font-size: 10px;
            color: var(--text-dim);
            margin-left: auto;
        }
        .dock-hops-button-row { margin-top: 6px; }
        .dock-feed-section { margin-top: 6px; }
        .dock-fleet-feed {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px;
            background: var(--panel-bg);
            font-family: var(--font-code);
            font-size: 10px;
            color: var(--text-dim);
        }
        .dock-fleet-feed-entry {
            white-space: nowrap;
        }
        #dock-empty {
            display: none;
            flex: 1 1 auto;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            text-align: center;
        }
        #dock-empty.is-visible { display: flex; }
        #dock-empty .dock-cli-input {
            width: 80%;
            max-width: 320px;
            font-size: 12px;
            font-family: var(--font-code);
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            padding: 4px 8px;
            box-sizing: border-box;
        }
        #dock-empty .dock-cli-input:focus { border-color: var(--accent-primary); }
        #dock-empty-hint { font-size: 11px; color: var(--text-dim); line-height: 1.5; }
        /* xterm viewport host fills its pane */
        .terminal-view-host {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body data-panel="terminals">
    <div id="dock-header">
        <div id="dock-tabs" role="tablist" aria-label="Dock tabs">
            <button id="dock-tab-agent" type="button" class="dock-tab-btn is-active" role="tab" aria-selected="true">Agent</button>
            <button id="dock-tab-cli" type="button" class="dock-tab-btn" role="tab" aria-selected="false">CLI</button>
            <button id="dock-tab-fleet" type="button" class="dock-tab-btn" role="tab" aria-selected="false">Fleet</button>
        </div>
        <span id="dock-title"></span>
        <div id="dock-cli-wrap" class="dock-cli-wrap collapsed"></div>
        <button id="dock-restart" type="button" class="dock-chip" aria-label="Restart agent" style="display:none">Restart</button>
        <button id="dock-close" type="button" class="dock-icon-btn"
                aria-label="Close agent dock">&times;</button>
    </div>
    <div id="dock-empty">
        <input id="dock-cli-input" type="text" placeholder="Startup command (e.g. claude)" class="dock-cli-input" />
        <button id="dock-start" type="button" class="dock-start-btn" disabled>Start</button>
        <div id="dock-empty-hint"></div>
    </div>
    <div id="dock-agent-pane">
        <div class="agent-control-log" id="agent-control-log"></div>
        <div class="agent-control-quickactions" id="agent-control-quickactions"></div>
        <div class="agent-control-input-row">
            <input type="text" class="agent-control-input" id="agent-control-input"
                   placeholder="Type an intent (e.g. 'dispatch my starred cards')" />
            <button type="button" class="agent-control-send" id="agent-control-send">Send</button>
        </div>
        <div class="agent-control-status" id="agent-control-status">Control surface ready.</div>
    </div>
    <div id="dock-cli-pane"></div>
    <div id="dock-fleet" class="dock-fleet-pane" hidden>
        <div id="dock-fleet-offline" class="dock-fleet-offline" hidden>
            No running Switchboard instance reachable for this workspace.
        </div>
        <div id="dock-fleet-content" class="dock-fleet-content">
            <div class="dock-fleet-table-wrap">
                <table class="dock-fleet-table">
                    <thead>
                        <tr>
                            <th>SEAT</th>
                            <th>ROLE</th>
                            <th>STATUS</th>
                            <th>CURRENT PLAN / TASK</th>
                        </tr>
                    </thead>
                    <tbody id="dock-fleet-tbody"></tbody>
                </table>
            </div>
            <div class="dock-hops-section">
                <div class="dock-hop-row">
                    <label class="dock-hop-label">
                        <input type="checkbox" id="dock-hop-plan" class="dock-hop-checkbox" />
                        <span>Dispatch created plans to the planning team</span>
                    </label>
                    <span id="dock-hop-plan-reason" class="dock-hop-reason"></span>
                </div>
                <div class="dock-hop-row">
                    <label class="dock-hop-label">
                        <input type="checkbox" id="dock-hop-code" class="dock-hop-checkbox" />
                        <span>Dispatch plans to the coding team</span>
                    </label>
                    <span id="dock-hop-code-reason" class="dock-hop-reason"></span>
                </div>
                <div class="dock-hop-row">
                    <label class="dock-hop-label">
                        <input type="checkbox" id="dock-hop-review" class="dock-hop-checkbox" />
                        <span>Dispatch coded plans to the review team</span>
                    </label>
                    <span id="dock-hop-review-reason" class="dock-hop-reason"></span>
                </div>
                <div class="dock-hops-button-row">
                    <button id="dock-hops-btn" type="button" class="dock-start-btn">Start</button>
                </div>
            </div>
            <div class="dock-feed-section">
                <div id="dock-fleet-feed" class="dock-fleet-feed"></div>
            </div>
        </div>
    </div>
    <!-- SHARED_DEFAULTS_SCRIPT -->
    <script nonce="{{NONCE}}" src="{{XTERM_JS_URI}}"></script>
    <script nonce="{{NONCE}}" src="{{XTERM_ADDON_FIT_URI}}"></script>
    <script nonce="{{NONCE}}" src="{{XTERM_ADDON_WEBGL_URI}}"></script>
    <script nonce="{{NONCE}}" src="{{XTERM_ADDON_CANVAS_URI}}"></script>
    <script nonce="{{NONCE}}" src="{{SHARED_UTILS_URI}}"></script>
    <script nonce="{{NONCE}}" src="{{TERMINAL_VIEWPORT_JS_URI}}"></script>
    <script nonce="{{NONCE}}" src="{{DOCK_JS_URI}}"></script>
</body>
</html>
