<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CSP mirrors terminals.html: the viewport needs ws: for the pty stream.
         Without connect-src ws: wss: the terminal connects to nothing, silently. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{NONCE}}' 'self'; style-src 'unsafe-inline' 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-src 'none';">
    <title>Dock</title>
    <link rel="stylesheet" href="{{XTERM_CSS_URI}}">
    <link rel="stylesheet" href="{{STATUS_CARDS_CSS_URI}}">
    <style>
        @font-face {
            font-family: 'Hanken Grotesk';
            src: url('{{HANKEN_FONT_URI}}') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        :root {
            /* The field is the site's green-black (--background #101414), not
               pure black. Black is the default chrome of every agent tool; the
               phosphor tint is what makes this a scope. */
            --bg-color: #101414;
            --panel-bg: #0b0f0f;
            --panel-bg2: #141818;
            --border-color: #333333;
            --border-bright: #444444;
            --text-primary: #e0e0e0;
            --text-dim: #5e6666;
            /* WAS MISSING ENTIRELY. dock.js's crew panel reads --text-secondary
               eight times; in the default theme it resolved to nothing, so every
               small-caps label and every unlit lamp inherited body brightness — an
               unlit STANDBY rendered at the same value as a lit one. It existed
               in command.html only, which is exactly the two-surface divergence
               the panel is supposed to avoid. */
            --text-secondary: #a0a6a6;
            --accent-primary: #00e5ff;
            --accent-dim: rgba(0, 229, 255, 0.25);
            --font-family: 'Hanken Grotesk', Menlo, Consolas, sans-serif;
            --font-code:   Menlo, Consolas, monospace;
            /* Instrument chrome, from the site's outline tokens. */
            --panel-line: #1d2323;
            --panel-edge: #363a3a;
            --term-surface:   #171717;
            --term-grid:      rgba(0, 229, 255, 0.03);
            --term-grid-size: 32px;
            --term-selection: rgba(0, 229, 255, 0.3);
            --state-connecting: #d7a03a;
            --state-readonly:   #f85149;
            /* Semantic state colours for structured cards (statusCards.css).
               Defined once here, shared by the card's state chips, so `blocked`
               / `finished` / `question` read as states in both themes and the
               brand accent is never used as one. */
            --error:   #ff4747;
            --warning: #ffb800;
            --success: #3ef06d;
        }
        body.theme-claudify {
            --accent-primary: #D97757;
            --accent-dim: rgba(217, 119, 87, 0.25);
            --term-grid: rgba(255, 255, 255, 0.03);
            --term-selection: rgba(217, 119, 87, 0.3);
        }
        body.cyber-theme-enabled,
        body.theme-claudify {
            background-color: var(--term-surface);
            background-image:
                linear-gradient(var(--term-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--term-grid) 1px, transparent 1px);
            background-size: var(--term-grid-size) var(--term-grid-size),
                             var(--term-grid-size) var(--term-grid-size);
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 12px;
            overflow: hidden;
        }
        /* ── Dock header: tab strip + title + restart + close ── */
        #dock-header {
            flex: 0 0 32px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 6px;
            border-bottom: 1px solid var(--border-color);
            background: var(--panel-bg);
        }
        #dock-tabs {
            display: flex;
            align-items: center;
            gap: 2px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 1px;
        }
        .dock-tab-btn {
            background: transparent;
            border: none;
            border-radius: 3px;
            color: var(--text-dim);
            font-family: var(--font-family);
            font-size: 11px;
            padding: 2px 8px;
            cursor: pointer;
        }
        .dock-tab-btn:hover { color: var(--text-primary); }
        .dock-tab-btn.is-active {
            background: var(--panel-bg);
            color: var(--text-primary);
        }
        #dock-title {
            flex: 1 1 auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-dim);
            font-size: 11px;
        }
        .dock-chip {
            background: var(--bg-color);
            border: 1px solid var(--accent-dim);
            border-radius: 3px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 11px;
            padding: 2px 8px;
            cursor: pointer;
        }
        .dock-chip:hover { background: var(--accent-dim); }
        .dock-icon-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 3px;
            color: var(--text-dim);
            font-size: 16px;
            line-height: 1;
            padding: 2px 6px;
            cursor: pointer;
        }
        .dock-icon-btn:hover { color: var(--text-primary); background: var(--bg-color); border-color: var(--border-color); }
        .dock-start-btn {
            background: var(--bg-color);
            border: 1px solid var(--accent-dim);
            border-radius: 3px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 11px;
            padding: 3px 10px;
            cursor: pointer;
        }
        .dock-start-btn:hover { background: var(--accent-dim); color: var(--text-primary); }
        .dock-start-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
        #dock-cli-wrap {
            display: none;
            align-items: center;
            gap: 4px;
        }
        #dock-cli-wrap.is-visible { display: flex; }
        #dock-cli-wrap .dock-cli-input {
            width: 120px;
            font-size: 11px;
            font-family: var(--font-code);
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            color: var(--text-primary);
            padding: 2px 6px;
        }
        #dock-cli-wrap .dock-cli-input:focus { border-color: var(--accent-primary); }
        /* ── Panes: one visible at a time ── */
        #dock-agent-pane,
        #dock-cli-pane {
            display: none;
            flex: 1 1 auto;
            background: var(--term-surface);
            overflow: hidden;
        }
        #dock-agent-pane.is-visible,
        #dock-cli-pane.is-visible { display: block; }
        /* ── Agent control surface ──────────────────────────────────────────
           The Agent tab is an API-backed control surface, not a pty seat.
           No terminal emulator — an input, a resolution log, quick-action
           buttons, and a status line. See plan:
           the-dock-agent-tab-is-a-control-surface-not-a-terminal. */
        #dock-agent-pane {
            display: none;
            flex: 1 1 auto;
            flex-direction: column;
            /* NO GAPS, NO OUTER MARGIN. This was five bordered boxes floating
               on a flat field with 9px between them, which is card layout — it
               reads as a website sidebar because it was built like one. A panel
               is ONE continuous fascia: sections butt against each other and are
               divided by a scribed line, never by whitespace, and the instruments
               are recessed INTO the face rather than sitting on top of it.
               Each section carries its own gutter instead. */
            gap: 0;
            background: var(--bg-color);
            overflow: hidden;
            padding: 0;
        }
        #dock-agent-pane.is-visible { display: flex; }
        .agent-control-log {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 8px 10px;
            font-family: var(--font-code);
            font-size: 12px;
            line-height: 1.5;
            color: var(--text-primary);
        }
        .agent-control-entry {
            margin-bottom: 10px;
            padding: 6px 8px;
            border-radius: 4px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
        }
        .agent-control-entry.is-user {
            border-color: var(--accent-dim);
        }
        .agent-control-entry-role {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }
        .agent-control-entry-text {
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .agent-control-resolved {
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-dim);
        }
        .agent-control-resolved-card {
            display: inline-block;
            margin: 2px 4px 2px 0;
            padding: 1px 6px;
            border-radius: 3px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            font-size: 10px;
            color: var(--text-primary);
        }
        .agent-control-actions {
            margin-top: 4px;
            font-size: 11px;
            color: var(--accent-primary);
        }
        .agent-control-action-error {
            color: #f85149;
        }
        /* Setup lives at the FOOT of the pane, below the readout — it used to
           sit between the Pilot station and the button that arms it, which is
           most of why the panel read as a settings screen. `margin-top:auto` on
           the group is what leaves the readout sized to its own content. */
        .agent-setup-foot {
            margin-top: auto;
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 11px 12px 0;
            border-top: 1px solid #050707;
            box-shadow: inset 0 1px 0 color-mix(in srgb, var(--panel-edge) 45%, transparent);
        }
        .agent-control-quickactions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 8px 0 0;
            border-top: 1px solid var(--panel-line);
        }
        .agent-control-quickactions:empty { display: none; }
        .agent-control-quickbtn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-dim);
            font-family: var(--font-family);
            font-size: 11px;
            padding: 3px 8px;
            cursor: pointer;
        }
        .agent-control-quickbtn:hover { color: var(--text-primary); border-color: var(--accent-dim); }
        .agent-control-picker-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 6px 10px;
            border-top: 1px solid var(--border-color);
            background: var(--panel-bg);
            align-items: center;
        }
        .agent-control-picker-row select {
            flex: 1 1 auto;
            min-width: 120px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: var(--font-code);
            font-size: 11px;
            padding: 4px 6px;
            outline: none;
            box-sizing: border-box;
        }
        /* A machined division — a cut into the face with the light catching its
           lower lip. Sections are separated by this and by nothing else. */
        .sect {
            position: relative;
            padding: 11px 12px;
            flex: 0 0 auto;
        }
        .sect::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 2px;
            background: linear-gradient(
                #050707 0 1px,
                color-mix(in srgb, var(--panel-edge) 55%, transparent) 1px 2px);
            pointer-events: none;
        }
        /* ── CREW ────────────────────────────────────────────────────────────
           Two stations flying one mission, side by side, because that is what
           this product is: two models and a board between them, not one
           orchestrator driving agents. Each station is an annunciator tile —
           DARK until its circuit closes. That idea was already named in the
           code and then drawn as a 9px grey dot beside ordinary text; here the
           tile itself is the lamp.

           No typeface does any of this work. `correct-font-role-assignment`
           confines monospace to content where columns align, so the panel is
           Hanken like the rest of the UI, and the instrument reads as one
           through form, colour and lamp state. --font-code appears exactly
           once below, on stacked numerics, which is the allowlist's own case. */
        .agent-models {
            display: flex;
            gap: 1px;
            align-items: stretch;
            /* One scribe between the two wells, not an 8px gutter. They are two
               stations on one panel, not two cards in a list. */
            background: #050707;
        }
        .crew-station {
            flex: 1 1 0;
            min-width: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 9px 11px 10px;
            /* RECESSED, not raised. A 1px outline on a lighter fill made each
               station a card sitting on the page; an inset shadow with a lit
               bottom lip makes it a well cut into the fascia. */
            background: #080b0b;
            border: 0;
            border-radius: 2px;
            box-shadow:
                inset 0 2px 4px rgba(0, 0, 0, 0.85),
                inset 0 -1px 0 color-mix(in srgb, var(--panel-edge) 50%, transparent);
        }
        .crew-station.is-lit {
            box-shadow:
                inset 0 2px 4px rgba(0, 0, 0, 0.85),
                inset 0 0 0 1px color-mix(in srgb, var(--accent-primary) 40%, transparent),
                inset 0 -1px 0 color-mix(in srgb, var(--accent-primary) 55%, transparent);
        }
        .crew-head {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 1px;
        }
        .crew-role { flex: 1 1 auto; }
        /* The role's own aircraft — the same pixel jet the scope tags its
           contacts with, and the same file the board rail uses. */
        .crew-jet {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            image-rendering: pixelated;
            opacity: 0.3;
        }
        .crew-station.is-lit .crew-jet { opacity: 1; }
        .crew-role {
            font-size: 9px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* The state word IS the lamp. An annunciator does not put a dot beside
           a label; the legend lights up. */
        .crew-state {
            font-size: 11px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        .crew-station.is-lit .crew-state {
            color: var(--accent-primary);
            text-shadow: 0 0 9px color-mix(in srgb, var(--accent-primary) 40%, transparent);
        }
        .crew-model {
            font-size: 11px;
            line-height: 1.3;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .crew-station.is-dark .crew-model { color: var(--text-dim); }
        /* A measure, not a sentence — and the one place on this panel where
           monospace earns itself: used/limit is a stacked numeric. */
        .crew-readout {
            margin-top: 1px;
            font-family: var(--font-code);
            font-size: 10px;
            letter-spacing: 0.04em;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .crew-readout.is-near { color: var(--warning); }
        .crew-readout.is-over { color: var(--error); }
        /* The arm switch lives IN the station it arms. It used to sit three
           blocks down, past a config disclosure — which is the only reason the
           annunciator had to carry a caption telling you where the button was. */
        .crew-switch {
            margin-top: auto;
            align-self: flex-start;
            background: var(--bg-color);
            border: 1px solid var(--panel-edge);
            border-radius: 2px;
            color: var(--text-secondary);
            font-family: var(--font-family);
            font-size: 9px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 4px 9px;
            cursor: pointer;
        }
        .crew-switch:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .crew-switch[disabled] { opacity: 0.45; cursor: not-allowed; }
        /* Transient only: what the last control did. Steady state belongs to the
           station, so this line is empty most of the time. */
        .agent-poll {
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 12px;
        }
        /* Matches .dock-start-btn — the dock's own button convention. */
        .agent-poll-btn {
            background: var(--bg-color);
            border: 1px solid var(--accent-dim);
            border-radius: 3px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 11px;
            padding: 3px 10px;
            cursor: pointer;
        }
        .agent-poll-btn:hover { background: var(--accent-dim); color: var(--text-primary); }
        .agent-poll-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
        .agent-poll-state {
            font-size: 10px;
            color: var(--text-secondary);
        }
        /* A chat transcript: one message per pass, newest at the bottom.
           There is no composer — the operator does not talk back here. */
        .agent-poll-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .agent-poll-proj-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-dim);
        }
        .agent-poll-project {
            background: var(--bg-color);
            color: var(--text-primary);
            border: 1px solid var(--accent-dim);
            border-radius: 3px;
            font-family: var(--font-family);
            font-size: 11px;
            padding: 3px 8px;
        }
        /* ── READOUT ─────────────────────────────────────────────────────────
           IT SCROLLS. It did not, and the pane above it is overflow:hidden, so
           picking a team rendered a 6,388px card into a 711px box: roughly
           5,700px of it was unreachable, and what did render painted over the
           channel bar and the status line. On the phone the same clip cut the
           panel's one primary action, "Start mission", in half. */
        .agent-poll-report {
            padding: 0 12px;
            /* Sized to its own content, shrinking (and scrolling) only when the
               content is taller than the pane. `flex: 1 1 auto` forced it to the
               full height whatever it held, which is where the 380px of dead
               space under a short readout came from. */
            flex: 0 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
        }
        /* ── CHANNELS ────────────────────────────────────────────────────────
           Above the readout they scope, not stranded at the foot of the pane
           beneath 380px of dead space. They select a SOURCE — the controller's
           board report, or one team's own seat reports — so they are channels,
           not a filter over one feed. */
        .agent-report-teams {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .agent-channel-btn {
            background: transparent;
            border: 0;
            border-bottom: 2px solid transparent;
            border-radius: 0;
            color: var(--text-dim);
            font-family: var(--font-family);
            font-size: 9px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 3px 2px 5px;
            cursor: pointer;
        }
        /* BOARD is a different KIND of channel from the four team channels —
           the controller's own report against the seats' own reports. One hair
           rule says so without a second row of chrome. */
        .agent-channel-btn:first-child {
            margin-right: 6px;
            padding-right: 14px;
            border-right: 1px solid var(--panel-line);
        }
        .agent-channel-btn:hover { color: var(--text-primary); }
        .agent-channel-btn.is-active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
        }

        /* ── ANNUNCIATOR ─────────────────────────────────────────────────────
           The verdict, on the scope's own field: the grid the dock already
           defines for the terminal viewport, and a scanline over it. The panel
           used a plain rounded rect with a 1px grey border, which is the
           default shape of every dark admin tool. */
        .ann {
            position: relative;
            margin: 11px 0;
            padding: 15px 14px 13px;
            border: 0;
            border-radius: 2px;
            box-shadow:
                inset 0 2px 5px rgba(0, 0, 0, 0.9),
                inset 0 -1px 0 color-mix(in srgb, var(--panel-edge) 45%, transparent);
            background-color: #060909;
            background-image:
                repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px),
                linear-gradient(var(--term-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--term-grid) 1px, transparent 1px);
            background-size: auto, 18px 18px, 18px 18px;
            overflow: hidden;
        }
        .ann::before,
        .ann::after {
            content: '';
            position: absolute;
            width: 9px;
            height: 9px;
            border: 1px solid var(--panel-edge);
            pointer-events: none;
        }
        .ann::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
        .ann::after  { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
        .ann-word {
            font-size: 26px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.07em;
        }
        .ann-caption {
            font-size: 12.5px;
            line-height: 1.45;
            margin-top: 8px;
            color: var(--text-primary);
        }
        /* Engraved sub-label: small caps, wide tracking, dim. The panel's own
           convention, now with a token behind its colour. */
        .stencil {
            font-size: 9px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        /* ── SYSTEMS CHECK ───────────────────────────────────────────────────
           The pre-flight list, read one line at a time: a lamp, the system, and
           the single fact that decides it. */
        .sys-row {
            display: flex;
            align-items: baseline;
            gap: 9px;
            padding: 6px 2px;
            border-bottom: 1px solid color-mix(in srgb, var(--panel-line) 70%, transparent);
        }
        .sys-lamp {
            box-sizing: border-box;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
            position: relative;
            top: -2px;
        }
        .sys-name { min-width: 74px; flex-shrink: 0; }
        .sys-fact { font-size: 12px; line-height: 1.4; }

        /* ── MISSION STRIPS ──────────────────────────────────────────────────
           What the crew is flying. */
        .mission-strip {
            padding: 10px 2px;
            border-bottom: 1px solid color-mix(in srgb, var(--panel-line) 70%, transparent);
        }
        .mission-name { font-size: 12.5px; line-height: 1.35; color: var(--text-primary); }
        .mission-track {
            height: 3px;
            border-radius: 2px;
            margin-top: 7px;
            background: var(--panel-line);
            overflow: hidden;
        }
        .mission-fill { height: 100%; background: var(--accent-primary); }
        /* A mission's filled-in parameters. The ORDER is rendered from the
           board's own sequencing view, so the strip and the queue pop agree.
           `is-unset` is a distinct look, not a dimmer one: "nobody arranged
           this" must not read like "arranged, with no constraints". */
        .mission-params {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 10px;
            color: var(--text-secondary);
        }
        .mission-param.is-unset { color: var(--text-dim); }
        .mission-param.is-error { color: #f85149; }
        .mission-param-btn {
            margin-top: 7px;
            align-self: flex-start;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-dim);
            font-family: var(--font-family);
            font-size: 10px;
            padding: 3px 9px;
            cursor: pointer;
        }
        .mission-param-btn:hover { color: var(--text-primary); border-color: var(--accent-dim); }
        .mission-param-btn[disabled] { opacity: 0.5; cursor: not-allowed; }

        /* ── SEAT REPORTS ────────────────────────────────────────────────────
           The scoped channel was an undesigned dump: 400-word entries at full
           body size, no state, no clamp. A seat's word is a report — it has a
           sender, a kind and a time. */
        .seat-report {
            padding: 9px 2px;
            border-bottom: 1px solid color-mix(in srgb, var(--panel-line) 70%, transparent);
        }
        .seat-head {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .seat-from { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .seat-kind {
            flex-shrink: 0;
            border: 1px solid currentColor;
            border-radius: 2px;
            padding: 1px 5px;
            font-size: 8px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .seat-when { flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .seat-body {
            font-size: 12px;
            line-height: 1.45;
            color: var(--text-primary);
            word-break: break-word;
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 4;
        }
        .seat-report.is-open .seat-body { -webkit-line-clamp: unset; }
        .next-up {
            margin-top: 11px;
            padding: 12px 12px 14px 13px;
            border: 0;
            border-left: 2px solid color-mix(in srgb, var(--accent-primary) 50%, transparent);
            background: linear-gradient(90deg,
                color-mix(in srgb, var(--accent-primary) 5%, transparent), transparent 60%);
        }
        /* The board's middle level, named on the card it belongs to. */
        .next-up-kind {
            margin-left: 7px;
            padding: 1px 5px;
            border: 1px solid color-mix(in srgb, var(--accent-primary) 40%, transparent);
            border-radius: 2px;
            font-size: 8px;
            letter-spacing: 0.12em;
            color: var(--accent-primary);
        }
        .next-up-topic {
            font-size: 12.5px;
            line-height: 1.4;
            margin-top: 5px;
            color: var(--text-primary);
        }
        /* Primary, and in the panel's own idiom — the same switch the crew
           stations carry, lit because this one starts something. */
        .next-up-go {
            margin-top: 11px;
            background: color-mix(in srgb, var(--accent-primary) 12%, transparent);
            border: 1px solid color-mix(in srgb, var(--accent-primary) 55%, transparent);
            border-radius: 2px;
            color: var(--accent-primary);
            font-family: var(--font-family);
            font-size: 9px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            padding: 6px 12px;
            cursor: pointer;
        }
        .next-up-go:hover { background: color-mix(in srgb, var(--accent-primary) 22%, transparent); }
        .next-up-go[disabled] { opacity: 0.5; cursor: not-allowed; }
        .seat-more {
            background: none;
            border: 0;
            padding: 3px 0 0;
            cursor: pointer;
            font-family: var(--font-family);
            font-size: 9px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-primary);
        }
        .agent-control-config-wrap {
            border: 0;
            border-top: 1px solid #050707;
            box-shadow: inset 0 1px 0 color-mix(in srgb, var(--panel-edge) 35%, transparent);
            margin: 0 -12px;
        }
        .agent-control-config-toggle { padding-left: 12px; padding-right: 12px; }
        .agent-control-config-toggle {
            cursor: pointer;
            list-style: none;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-dim);
            padding: 7px 10px;
            user-select: none;
        }
        .agent-control-config-toggle::-webkit-details-marker { display: none; }
        .agent-control-config-toggle::before { content: '\25B8  '; }
        details[open] > .agent-control-config-toggle::before { content: '\25BE  '; }
        .agent-control-config-toggle:hover { color: var(--accent-primary); }
        .agent-control-config-wrap > .agent-control-config { border: 0; }
        .agent-poll-msg {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 92%;
        }
        .agent-poll-meta {
            font-size: 9px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin: 0 0 3px 10px;
        }
        .agent-poll-bubble {
            background: var(--panel-bg2);
            border: 1px solid var(--border-color);
            border-radius: 12px 12px 12px 3px;
            padding: 7px 11px;
            font-size: 12px;
            line-height: 1.45;
            color: var(--text-color);
            word-break: break-word;
        }
        .agent-poll-msg.is-problem .agent-poll-bubble {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        .agent-poll-empty {
            font-size: 11px;
            color: var(--text-dim);
            padding: 8px 2px;
        }
        .agent-control-config {
            padding: 8px 12px 12px;
            border-top: 1px solid var(--border-color);
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .agent-control-config label {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .agent-control-config input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: var(--font-code);
            font-size: 11px;
            padding: 4px 8px;
            outline: none;
            box-sizing: border-box;
            width: 100%;
        }
        .agent-control-config input:focus { border-color: var(--accent-primary); }
        .agent-control-config-save {
            align-self: flex-end;
            background: var(--accent-dim);
            border: 1px solid var(--accent-dim);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 11px;
            padding: 4px 14px;
            cursor: pointer;
        }
        .agent-control-config-save:hover { background: var(--accent-primary); color: var(--bg-color); }
        .agent-control-config-status {
            font-size: 10px;
            color: var(--text-dim);
        }
        .agent-control-config-status.is-error { color: #f85149; }
        /* ── The Navigator's mission conversation ─────────────────────────
           Two fields, a Propose button, a list of checkboxes and an Apply
           button. Deliberately NOT a form: the whole point of the feature is
           that the operator states a subject and a goal and is done. */
        .agent-nav-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .agent-nav-coldbtn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-dim);
            font-family: var(--font-family);
            font-size: 11px;
            padding: 4px 10px;
            cursor: pointer;
        }
        .agent-nav-coldbtn:hover { color: var(--text-primary); border-color: var(--accent-dim); }
        .agent-nav-proposal { display: flex; flex-direction: column; gap: 4px; }
        .agent-nav-head { font-size: 11px; color: var(--text-primary); }
        .agent-nav-goal { font-size: 10px; color: var(--text-secondary); }
        .agent-nav-note { font-size: 10px; color: var(--warning); }
        .agent-nav-row {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .agent-nav-row input { width: auto; }
        .agent-nav-row .agent-nav-topic { color: var(--text-primary); }
        .agent-nav-row .agent-nav-col { font-size: 10px; color: var(--text-dim); }
        .agent-nav-group { border-top: 1px dashed var(--border-color); padding-top: 6px; }
        /* The footer spans the pane's gutter — a status bar that stops 12px
           short of the window edge reads as a stray row, not as chrome. Empty
           and silent when the model is fine: the Pilot station already names it,
           and repeating it there is what made the phone draw a green success
           chip for a non-event. */
        .agent-control-status {
            margin: 0;
            padding: 5px 12px;
            font-size: 10px;
            color: var(--text-dim);
            background: var(--panel-bg);
            border-top: 1px solid var(--panel-line);
        }
        .agent-control-status:empty { display: none; }
        .agent-control-status.is-error { color: #f85149; }
        .agent-control-status.is-model { color: var(--accent-primary); }
        #dock-fleet {
            display: none;
            flex: 1 1 auto;
            flex-direction: column;
            overflow: auto;
            padding: 8px;
            gap: 6px;
        }
        #dock-fleet.is-visible { display: flex; }
        .dock-fleet-offline {
            color: var(--text-dim);
            font-size: 12px;
            padding: 16px;
            text-align: center;
        }
        .dock-fleet-table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--panel-bg);
        }
        .dock-fleet-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-code);
            font-size: 11px;
            line-height: 1.4;
        }
        .dock-fleet-table th,
        .dock-fleet-table td {
            text-align: left;
            padding: 6px 10px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }
        .dock-fleet-table th {
            color: var(--text-dim);
            font-weight: 600;
            background: var(--bg-color);
        }
        .dock-fleet-table tbody tr:last-child td { border-bottom: none; }
        .dock-fleet-table td:nth-child(4) {
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dock-fleet-status-active { color: var(--accent-primary); }
        .dock-fleet-status-exited { color: var(--text-dim); }
        .dock-hops-section {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            background: var(--panel-bg);
        }
        .dock-hop-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .dock-hop-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--text-primary);
        }
        .dock-hop-reason {
            font-size: 10px;
            color: var(--text-dim);
            margin-left: auto;
        }
        .dock-hops-button-row { margin-top: 6px; }
        .dock-feed-section { margin-top: 6px; }
        .dock-fleet-feed {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px;
            background: var(--panel-bg);
            font-family: var(--font-code);
            font-size: 10px;
            color: var(--text-dim);
        }
        .dock-fleet-feed-entry {
            white-space: nowrap;
        }
        /* ── Composer pane ─────────────────────────────────────────────────
           A standing prompt surface, not a modal: target select, multi-line
           input, status line, SEND. Modelled on the .agent-control-* styles so
           the dock's two control surfaces read as the same product. Visibility
           follows the #dock-fleet idiom: display:none + `hidden` at rest,
           .is-visible shows it as a flex column. */
        #dock-composer-pane {
            display: none;
            flex: 1 1 auto;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            background: var(--bg-color);
            overflow: hidden;
        }
        #dock-composer-pane.is-visible { display: flex; }
        #dock-composer-pane label {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #dock-composer-target {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: var(--font-code);
            font-size: 11px;
            padding: 4px 6px;
            outline: none;
            box-sizing: border-box;
        }
        #dock-composer-target:focus { border-color: var(--accent-primary); }
        #dock-composer-input {
            flex: 1 1 auto;
            min-height: 80px;
            resize: none;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: var(--font-code);
            font-size: 12px;
            line-height: 1.5;
            padding: 6px 8px;
            outline: none;
            box-sizing: border-box;
        }
        #dock-composer-input:focus { border-color: var(--accent-primary); }
        #dock-composer-status {
            font-size: 10px;
            color: var(--text-dim);
            min-height: 12px;
        }
        #dock-composer-status.is-error { color: #f85149; }
        #dock-composer-send {
            align-self: flex-end;
            background: var(--accent-dim);
            border: 1px solid var(--accent-dim);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 11px;
            padding: 4px 14px;
            cursor: pointer;
        }
        #dock-composer-send:hover { background: var(--accent-primary); color: var(--bg-color); }
        #dock-composer-send[disabled] { opacity: 0.5; cursor: not-allowed; }
        #dock-empty {
            display: none;
            flex: 1 1 auto;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            text-align: center;
        }
        #dock-empty.is-visible { display: flex; }
        #dock-empty .dock-cli-input {
            width: 80%;
            max-width: 320px;
            font-size: 12px;
            font-family: var(--font-code);
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            padding: 4px 8px;
            box-sizing: border-box;
        }
        #dock-empty .dock-cli-input:focus { border-color: var(--accent-primary); }
        #dock-empty-hint { font-size: 11px; color: var(--text-dim); line-height: 1.5; }
        /* xterm viewport host fills its pane */
        .terminal-view-host {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body data-panel="terminals">
    <div id="dock-header">
        <div id="dock-tabs" role="tablist" aria-label="Dock tabs">
            <button id="dock-tab-agent" type="button" class="dock-tab-btn is-active" role="tab" aria-selected="true">Agent</button>
            <button id="dock-tab-cli" type="button" class="dock-tab-btn" role="tab" aria-selected="false">CLI</button>
            <button id="dock-tab-fleet" type="button" class="dock-tab-btn" role="tab" aria-selected="false">Fleet</button>
            <button id="dock-tab-composer" type="button" class="dock-tab-btn" role="tab" aria-selected="false">Composer</button>
        </div>
        <span id="dock-title"></span>
        <div id="dock-cli-wrap" class="dock-cli-wrap collapsed"></div>
        <button id="dock-restart" type="button" class="dock-chip" aria-label="Restart agent" style="display:none">Restart</button>
        <button id="dock-close" type="button" class="dock-icon-btn"
                aria-label="Close agent dock">&times;</button>
    </div>
    <div id="dock-empty">
        <input id="dock-cli-input" type="text" placeholder="Startup command (e.g. devin --model claude-opus-4.6)" class="dock-cli-input" />
        <button id="dock-start" type="button" class="dock-start-btn" disabled>Start</button>
        <div id="dock-empty-hint"></div>
    </div>
    <!-- ORDER IS THE DESIGN. Crew, then what the last control did, then the
         channel being watched, then the readout — which is the only part that
         scrolls. Setup (model config, mechanical fallbacks) is demoted below
         the readout: it used to sit between the PILOT station and the button
         that arms it, which is why the panel read as a settings screen. -->
    <div id="dock-agent-pane">
        <!-- Two stations flying one mission. Pilot is the controller's own
             judgement model; Navigator is the one it escalates to. The arm
             switch is rendered INTO the Pilot station by dock.js. -->
        <div class="sect">
            <div class="agent-models" id="agent-models"></div>
            <div class="agent-poll" id="agent-poll">
                <button type="button" class="agent-poll-btn" id="agent-poll-start" hidden>Arm watch</button>
                <button type="button" class="agent-poll-btn" id="agent-poll-stop" hidden>Stop watch</button>
                <span class="agent-poll-state" id="agent-poll-state"></span>
            </div>
        </div>
        <div class="sect" style="padding-bottom:0;">
            <div class="agent-report-teams" id="agent-report-teams"></div>
        </div>
        <div class="agent-poll-report" id="agent-poll-report"></div>
        <div class="agent-setup-foot">
        <div class="agent-control-quickactions" id="agent-control-quickactions"></div>

        <!-- The Navigator's two-question conversation. Subject and goal, then
             up to ten EXISTING cards it proposes; the operator unchecks what
             does not belong and applies. It writes a MISSION through
             /kanban/mission/create + /kanban/mission/member/add, never a
             feature — the mission strips above read the same store, so a new
             mission shows up there with no second renderer. -->
        <details class="agent-control-config-wrap" id="agent-navigator-mission-wrap">
            <summary class="agent-control-config-toggle">Start a mission</summary>
        <div class="agent-control-config">
            <label for="agent-navigator-subject">Subject</label>
            <input type="text" id="agent-navigator-subject" placeholder="what the mission is about" />
            <label for="agent-navigator-goal">Goal</label>
            <input type="text" id="agent-navigator-goal" placeholder="one sentence — what it is for" />
            <div class="agent-nav-actions">
                <button type="button" class="agent-nav-coldbtn" id="agent-navigator-cold">Look at the whole board</button>
                <button type="button" class="agent-control-config-save" id="agent-navigator-propose">Propose cards</button>
            </div>
            <div class="agent-control-config-status" id="agent-navigator-mission-status"></div>
            <div class="agent-nav-proposal" id="agent-navigator-mission-proposal"></div>
        </div>
        </details>

        <!-- The surface's own config: provider, model and key are set HERE,
             not via a repurposed startup command or an env var. The key field
             is write-only — it renders set/unset and never echoes the value.
             Which of these fields applies to which provider is decided by the
             shared controller in sharedUtils.js, not here and not in dock.js.

             TWO BLOCKS, TWO ROLE POINTERS. The Pilot block posts
             /agent/control/config (the board's judgement model); the Navigator
             block posts /controller/navigator (the model that organizes work).
             They read and write DISJOINT pointers over a SHARED provider rows
             map, so saving one never clears the other's fields. The Navigator
             is NOT the model the Pilot escalates to — it has a different job. -->
        <details class="agent-control-config-wrap" id="agent-pilot-config-wrap">
            <summary class="agent-control-config-toggle">Pilot model</summary>
        <div class="agent-control-config">
            <label for="agent-control-provider">Provider</label>
            <select id="agent-control-provider"></select>
            <label for="agent-control-endpoint" id="agent-control-endpoint-label">Server URL</label>
            <input type="text" id="agent-control-endpoint" placeholder="http://… (unset)" />
            <label for="agent-control-model-select" id="agent-control-model-label">Model</label>
            <select id="agent-control-model-select"></select>
            <input type="text" id="agent-control-model" placeholder="model name" />
            <label for="agent-control-key" id="agent-control-key-label">API key</label>
            <input type="password" id="agent-control-key" placeholder="(unset)" autocomplete="off" />
            <button type="button" class="agent-control-config-save" id="agent-control-config-save">Save config</button>
            <div class="agent-control-config-status" id="agent-control-config-status"></div>
        </div>
        </details>
        <details class="agent-control-config-wrap" id="agent-navigator-config-wrap">
            <summary class="agent-control-config-toggle">Navigator model</summary>
        <div class="agent-control-config">
            <label for="agent-navigator-provider">Provider</label>
            <select id="agent-navigator-provider"></select>
            <label for="agent-navigator-endpoint" id="agent-navigator-endpoint-label">Server URL</label>
            <input type="text" id="agent-navigator-endpoint" placeholder="http://… (unset)" />
            <label for="agent-navigator-model-select" id="agent-navigator-model-label">Model</label>
            <select id="agent-navigator-model-select"></select>
            <input type="text" id="agent-navigator-model" placeholder="model name" />
            <label for="agent-navigator-key" id="agent-navigator-key-label">API key</label>
            <input type="password" id="agent-navigator-key" placeholder="(unset)" autocomplete="off" />
            <button type="button" class="agent-control-config-save" id="agent-navigator-config-save">Save config</button>
            <div class="agent-control-config-status" id="agent-navigator-config-status"></div>
        </div>
        </details>
        </div>
        <div class="agent-control-status" id="agent-control-status"></div>
    </div>
    <div id="dock-cli-pane"></div>
    <div id="dock-fleet" class="dock-fleet-pane" hidden>
        <div id="dock-fleet-offline" class="dock-fleet-offline" hidden>
            No running Switchboard instance reachable for this workspace.
        </div>
        <div id="dock-fleet-content" class="dock-fleet-content">
            <div class="dock-fleet-table-wrap">
                <table class="dock-fleet-table">
                    <thead>
                        <tr>
                            <th>SEAT</th>
                            <th>ROLE</th>
                            <th>STATUS</th>
                            <th>CURRENT PLAN / TASK</th>
                        </tr>
                    </thead>
                    <tbody id="dock-fleet-tbody"></tbody>
                </table>
            </div>
            <div class="agent-control-reports" id="agent-control-reports"></div>
            <div class="dock-hops-section">
                <div class="dock-hop-row">
                    <label class="dock-hop-label">
                        <input type="checkbox" id="dock-hop-plan" class="dock-hop-checkbox" />
                        <span>Dispatch created plans to the planning team</span>
                    </label>
                    <span id="dock-hop-plan-reason" class="dock-hop-reason"></span>
                </div>
                <div class="dock-hop-row">
                    <label class="dock-hop-label">
                        <input type="checkbox" id="dock-hop-code" class="dock-hop-checkbox" />
                        <span>Dispatch plans to the coding team</span>
                    </label>
                    <span id="dock-hop-code-reason" class="dock-hop-reason"></span>
                </div>
                <div class="dock-hop-row">
                    <label class="dock-hop-label">
                        <input type="checkbox" id="dock-hop-review" class="dock-hop-checkbox" />
                        <span>Dispatch coded plans to the review team</span>
                    </label>
                    <span id="dock-hop-review-reason" class="dock-hop-reason"></span>
                </div>
                <div class="dock-hops-button-row">
                    <button id="dock-hops-btn" type="button" class="dock-start-btn">Start</button>
                </div>
            </div>
            <div class="dock-feed-section">
                <div id="dock-fleet-feed" class="dock-fleet-feed"></div>
            </div>
        </div>
    </div>
    <div id="dock-composer-pane" hidden>
        <label for="dock-composer-target">Target terminal</label>
        <select id="dock-composer-target"></select>
        <label for="dock-composer-input">Prompt</label>
        <textarea id="dock-composer-input" placeholder="Type a prompt or command. Multi-line input is delivered as a bracketed-paste block; a single line starting with / is sent as a control string."></textarea>
        <div id="dock-composer-status"></div>
        <button id="dock-composer-send" type="button">SEND</button>
    </div>
    <!-- SHARED_DEFAULTS_SCRIPT -->
    <script nonce="{{NONCE}}" src="{{SHARED_UTILS_URI}}"></script>
    <script nonce="{{NONCE}}" src="{{STATUS_CARDS_URI}}"></script>
    <script nonce="{{NONCE}}" src="/static/webview/dockComposer.js"></script>
    <script nonce="{{NONCE}}" src="{{TERMINAL_VIEWPORT_JS_URI}}"></script>
    <script nonce="{{NONCE}}" src="{{DOCK_JS_URI}}"></script>
</body>
</html>
