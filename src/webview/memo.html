<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{NONCE}}' 'self'; style-src 'unsafe-inline' 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://127.0.0.1:* wss://127.0.0.1:* ws://localhost:* wss://localhost:* ws://*.localhost:* wss://*.localhost:*; frame-src 'none';">
    <title>Memo</title>
    <style>
        @font-face {
            font-family: 'Hanken Grotesk';
            src: url('{{HANKEN_FONT_URI}}') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'GeistPixel';
            src: url('{{GEIST_PIXEL_FONT_URI}}') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #000000;
            --panel-bg2: #050505;
            --border-color: #333333;
            --border-bright: #444444;
            --text-primary: #e0e0e0;
            --text-secondary: #8C8C8C;
            --accent-primary: #00e5ff;
            --accent-teal: var(--accent-primary);
            --accent-teal-dim: color-mix(in srgb, var(--accent-teal) 40%, transparent);
            --accent-green: #4ec9b0;
            --accent-red: #f85149;
            --font-family: 'Hanken Grotesk', Menlo, Consolas, sans-serif;
            --font-code:   Menlo, Consolas, monospace;
        }

        /* Afterburner IS the :root palette (matches kanban/project/setup) — this
           class adds effects only. It must NOT repaint text or surfaces: it is the
           DEFAULT theme's class (getThemeBodyClass → 'cyber-theme-enabled'). */
        body.cyber-theme-enabled { }

        body.theme-claudify {
            /* The teal family derives from --accent-primary on :root, so each
               derived token is redeclared here or it stays cyan. */
            --accent-primary: #D97757;
            --accent-teal: #D97757;
            --accent-teal-dim: color-mix(in srgb, #D97757 40%, transparent);
            --text-secondary: #8C8C8C;
            --border-color: #333333;
            --border-bright: #444444;
        }

        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: var(--bg-color); color: var(--text-primary); font-family: var(--font-family); }
        .memo-header {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--panel-bg);
        }
        .memo-body { padding: 16px 20px; max-width: 760px; }
        .memo-hint { font-size: 11px; color: var(--text-secondary); line-height: 1.5; }
        /* Structure lives in classes, not in style="" attributes (the defect this
           panel was rebuilt to remove). */
        .memo-body > .memo-hint { margin: 0 0 4px; }
        .memo-body > .memo-hint:last-of-type { margin-bottom: 12px; }
        .memo-actions { display: flex; gap: 8px; margin-top: 10px; }
        .memo-actions .secondary-btn { flex: 1; }
        #memo-status { font-size: 11px; color: var(--text-secondary); min-height: 14px; display: block; margin-top: 8px; }

        .memo-workspace-row {
            display: flex; align-items: center; gap: 8px;
        }
        .memo-workspace-label {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .memo-workspace-select {
            background: var(--panel-bg2);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            font-size: 11px;
            padding: 2px 4px;
            border-radius: 2px;
            max-width: 240px;
        }
        .section-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-green);
            font-weight: 600;
            opacity: 0.7;
        }
        body.theme-claudify .section-label { color: #8a8a8a; }
        /* The pixel display face is downloaded by the @font-face above; apply it
           to the panel header the way project.html/kanban.html do, so the panel
           is not shipping a font that no selector can match. */
        .memo-header .section-label {
            font-family: 'GeistPixel', var(--font-code);
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        .secondary-btn {
            background: var(--panel-bg2);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: none;
            border-radius: 2px;
        }
        .secondary-btn:hover {
            background: color-mix(in srgb, var(--border-bright) 10%, transparent);
            border-color: var(--border-bright);
            color: var(--text-primary);
        }
        .secondary-btn.is-teal {
            color: var(--accent-teal);
            border-color: color-mix(in srgb, var(--accent-teal) 40%, transparent);
            background: color-mix(in srgb, var(--accent-teal) 5%, var(--panel-bg2));
        }
        .secondary-btn.is-teal:hover {
            border-color: var(--accent-teal);
            background: color-mix(in srgb, var(--accent-teal) 10%, var(--panel-bg2));
            box-shadow: 0 0 12px color-mix(in srgb, var(--accent-teal) 25%, transparent);
        }
        body.theme-claudify .secondary-btn.is-teal:hover { box-shadow: none; }
        .is-copied {
            color: var(--accent-green) !important;
            border-color: var(--accent-green) !important;
        }

        .modal-textarea {
            width: 100%;
            min-height: 320px;
            resize: vertical;
            background: #0a0a0a;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px;
            font-size: 12px;
        }
        .modal-textarea:hover,
        .modal-textarea:focus {
            border-color: var(--border-bright);
            outline: none;
        }

        /* Browser cockpit: opt this document into the dark native palette so a
           plain browser stops painting light scrollbars and light form controls
           on a black surface. The VS Code webview host supplies its own dark
           chrome, which is why the gap is browser-only. Unscoped on purpose —
           this panel has no light presentation in any theme. */
        :root { color-scheme: dark; }

        /* Scrollbar styling — the kanban.html/planning.html/design.html block
           plus -corner. The --vscode-* var is absent in a browser and falls
           through to this panel's own token, so one declaration serves both
           hosts. */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-corner {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--vscode-scrollbarSlider-background, var(--border-bright));
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--vscode-scrollbarSlider-hoverBackground, var(--text-secondary));
        }

        /* Firefox only. DO NOT hoist these two properties out of the @supports
           gate: Chromium 121+ and Safari 17.4+ ignore EVERY ::-webkit-scrollbar
           rule on a scroller that declares scrollbar-width or scrollbar-color,
           so an ungated copy silently deletes the 6px styling above. Chromium
           and Safari report this selector as supported and skip the block;
           Gecko reports it unsupported and enters it. */
        @supports not selector(::-webkit-scrollbar) {
            :root {
                scrollbar-width: thin;
                scrollbar-color: var(--border-bright) transparent;
            }
        }
    </style>
</head>
<body>
    <div class="memo-header">
        <span class="section-label">Memo</span>
        <label class="memo-workspace-row" for="memo-workspace-select">
            <span class="memo-workspace-label">Saving to</span>
            <select id="memo-workspace-select" class="memo-workspace-select"
                    title="Which workspace this memo is saved to. Does not change the board."></select>
        </label>
    </div>
    <div class="memo-body">
        <p class="memo-hint">
            Jot down bugs, thoughts, or issues — one per line or paragraph. Saved automatically.
            Send to an agent via Copy Prompt / Send to Planner to create one plan per issue.
        </p>
        <p class="memo-hint">Tip: you can also use 'start memo capture' in an agent chat.</p>
        <textarea id="memo-textarea" class="modal-textarea"
                  placeholder="Bug: login button overlaps on mobile&#10;&#10;Thought: maybe cache the user profile&#10;&#10;Issue: API returns 500 on empty payload..."></textarea>
        <span id="memo-status"></span>
        <div class="memo-actions">
            <button id="memo-clear-btn" class="secondary-btn">Clear</button>
            <button id="memo-copy-btn" class="secondary-btn is-teal">Copy Prompt</button>
            <button id="memo-send-btn" class="secondary-btn is-teal">Send to Planner</button>
        </div>
    </div>
    <!-- SHARED_DEFAULTS_SCRIPT -->
    <script nonce="{{NONCE}}" src="{{MEMO_JS_URI}}"></script>
</body>
</html>
