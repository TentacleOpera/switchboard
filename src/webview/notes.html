<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{NONCE}}' 'self'; style-src 'unsafe-inline' 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://127.0.0.1:* wss://127.0.0.1:* ws://localhost:* wss://localhost:*; frame-src 'none';">
    <title>Notes</title>
    <style>
        @font-face {
            font-family: 'Hanken Grotesk';
            src: url('{{HANKEN_FONT_URI}}') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'GeistPixel';
            src: url('{{GEIST_PIXEL_FONT_URI}}') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #000000;
            --panel-bg2: #050505;
            --border-color: #333333;
            --border-bright: #444444;
            --text-primary: #e0e0e0;
            --text-secondary: #8C8C8C;
            --accent-primary: #00e5ff;
            --accent-teal: var(--accent-primary);
            --accent-teal-dim: color-mix(in srgb, var(--accent-teal) 40%, transparent);
            --accent-green: #4ec9b0;
            --accent-red: #f85149;
            --font-family: 'Hanken Grotesk', Menlo, Consolas, sans-serif;
            --font-code:   Menlo, Consolas, monospace;
        }

        /* Afterburner IS the :root palette (matches kanban/project/setup) — this
           class adds effects only. It must NOT repaint text or surfaces: it is the
           DEFAULT theme's class (getThemeBodyClass → 'cyber-theme-enabled'). */
        body.cyber-theme-enabled { }

        body.theme-claudify {
            /* The teal family derives from --accent-primary on :root, so each
               derived token is redeclared here or it stays cyan. */
            --accent-primary: #D97757;
            --accent-teal: #D97757;
            --accent-teal-dim: color-mix(in srgb, #D97757 40%, transparent);
            --text-secondary: #8C8C8C;
            --border-color: #333333;
            --border-bright: #444444;
        }

        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: var(--bg-color); color: var(--text-primary); font-family: var(--font-family); }
        .notes-header {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--panel-bg);
        }
        .notes-body { padding: 16px 20px; max-width: 760px; }
        .notes-hint { font-size: 11px; color: var(--text-secondary); line-height: 1.5; margin: 0 0 12px; }

        .section-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-green);
            font-weight: 600;
            opacity: 0.7;
        }
        body.theme-claudify .section-label { color: #8a8a8a; }
        .notes-header .section-label {
            font-family: 'GeistPixel', var(--font-code);
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        /* List pane */
        .notes-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .note-row {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 8px 10px;
            background: var(--panel-bg2);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .note-row:hover { border-color: var(--border-bright); }
        .note-row-main { min-width: 0; flex: 1; }
        .note-row-title { font-size: 13px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .note-row-meta { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
        .note-row-delete {
            flex: 0 0 auto;
            background: none; border: 1px solid transparent; color: var(--text-secondary);
            font-size: 14px; line-height: 1; padding: 4px 8px; cursor: pointer; border-radius: 2px;
        }
        .note-row-delete:hover { color: var(--accent-red); border-color: color-mix(in srgb, var(--accent-red) 40%, transparent); }
        .notes-empty { font-size: 12px; color: var(--text-secondary); padding: 10px 0; }

        /* Form */
        .notes-form { display: flex; flex-direction: column; gap: 8px; }
        .notes-form label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-secondary); }
        .notes-input, .notes-select {
            width: 100%;
            background: #0a0a0a;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px;
            font-size: 12px;
            font-family: var(--font-family);
        }
        .notes-input:hover, .notes-input:focus, .notes-select:hover, .notes-select:focus { border-color: var(--border-bright); outline: none; }
        .modal-textarea {
            width: 100%;
            min-height: 200px;
            resize: vertical;
            background: #0a0a0a;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px;
            font-size: 12px;
        }
        .modal-textarea:hover, .modal-textarea:focus { border-color: var(--border-bright); outline: none; }
        .notes-field.hidden { display: none; }
        #notes-status { font-size: 11px; color: var(--text-secondary); min-height: 14px; display: block; }
        .notes-actions { display: flex; gap: 8px; margin-top: 4px; }
        .notes-actions .secondary-btn { flex: 1; }

        .secondary-btn {
            background: var(--panel-bg2);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: none;
            border-radius: 2px;
        }
        .secondary-btn:hover {
            background: color-mix(in srgb, var(--border-bright) 10%, transparent);
            border-color: var(--border-bright);
            color: var(--text-primary);
        }
        .secondary-btn.is-teal {
            color: var(--accent-teal);
            border-color: color-mix(in srgb, var(--accent-teal) 40%, transparent);
            background: color-mix(in srgb, var(--accent-teal) 5%, var(--panel-bg2));
        }
        .secondary-btn.is-teal:hover {
            border-color: var(--accent-teal);
            background: color-mix(in srgb, var(--accent-teal) 10%, var(--panel-bg2));
            box-shadow: 0 0 12px color-mix(in srgb, var(--accent-teal) 25%, transparent);
        }
        body.theme-claudify .secondary-btn.is-teal:hover { box-shadow: none; }

        /* Browser cockpit: opt into the dark native palette (see memo.html). */
        :root { color-scheme: dark; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-corner { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--vscode-scrollbarSlider-background, var(--border-bright));
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--vscode-scrollbarSlider-hoverBackground, var(--text-secondary));
        }
        @supports not selector(::-webkit-scrollbar) {
            :root {
                scrollbar-width: thin;
                scrollbar-color: var(--border-bright) transparent;
            }
        }
    </style>
</head>
<body>
    <div class="notes-header">
        <span class="section-label">Notes</span>
        <span id="notes-workspace" class="notes-hint" title="Workspace these notes are saved to"></span>
    </div>
    <div class="notes-body">
        <p class="notes-hint">
            Plan jottings, meeting minutes, and agent briefings — a file-based store the
            orchestrator tick also reads. Meetings with a time feed the upcoming-meeting digest.
        </p>

        <div class="section-label">Notes</div>
        <div id="notes-list" class="notes-list"></div>

        <div class="section-label">New note</div>
        <div class="notes-form">
            <input type="hidden" id="note-id">
            <label for="note-title">Title</label>
            <input type="text" id="note-title" class="notes-input" placeholder="Weekly sync with Platform team">

            <label for="note-kind">Kind</label>
            <select id="note-kind" class="notes-select">
                <option value="plan">Plan</option>
                <option value="meeting">Meeting</option>
                <option value="briefing">Briefing</option>
            </select>

            <div id="note-when-field" class="notes-field hidden">
                <label for="note-when">When (meetings only)</label>
                <input type="datetime-local" id="note-when" class="notes-input">
            </div>

            <label for="note-tags">Tags (comma-separated, optional)</label>
            <input type="text" id="note-tags" class="notes-input" placeholder="platform, sync">

            <label for="note-body">Body</label>
            <textarea id="note-body" class="modal-textarea" placeholder="- Agenda item 1&#10;- Action: follow up with …"></textarea>

            <span id="notes-status"></span>
            <div class="notes-actions">
                <button id="note-new-btn" class="secondary-btn">New / Clear</button>
                <button id="note-save-btn" class="secondary-btn is-teal">Save note</button>
            </div>
        </div>
    </div>
    <!-- SHARED_DEFAULTS_SCRIPT -->
    <script nonce="{{NONCE}}" src="{{NOTES_JS_URI}}"></script>
</body>
</html>
