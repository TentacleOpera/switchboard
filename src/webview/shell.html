<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Switchboard</title>
    <!--
        Headless app-shell — Feature: Headless Browser UI.
        Left icon strip + same-origin iframe content area. The strip is rendered
        from the /panels manifest (data-driven), so adding a panel route later
        adds a strip icon with no shell code change. All panels stay mounted as
        iframes (state + live WebSocket preserved across switches).
        CSP: same-origin only; scripts via nonce; frames same-origin; WebSocket
        to 127.0.0.1 for the panels' live transport.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{NONCE}}' 'self'; style-src 'unsafe-inline' 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://127.0.0.1:* wss://127.0.0.1:* ws://localhost:* wss://localhost:* ws://*.localhost:* wss://*.localhost:*; frame-src 'self';" />
    <style>
        @font-face {
            font-family: 'Hanken Grotesk';
            src: url('/static/designs/HankenGrotesk-Variable.woff2') format('woff2');
            font-weight: 100 900;
            font-display: swap;
        }
        :root {
            --bg: #0a0a0f;
            --bg-elev: #11111a;
            --bg-strip: #060609;
            --border: #1f1f2e;
            --text: #e0e0e8;
            --text-dim: #7a7a8c;
            --accent: #00f0ff;
            --accent-dim: #007a8a;
            --font:      'Hanken Grotesk', Menlo, Consolas, sans-serif;
            --font-code: Menlo, Consolas, monospace;
        }
        /* Claudify: retint the strip's highlight to the panels' terracotta accent
           (mirrors body.theme-claudify in kanban.html — #D97757 / #E2A188). The
           theme class arrives server-stamped on the body tag and is swapped live
           by applyThemeToAll in shell.js. NOTE: never write a literal body tag in
           comments here — applyThemeClass stamps the theme onto the FIRST match
           in the file. */
        body.theme-claudify {
            --accent: #D97757;
            --accent-dim: color-mix(in srgb, #D97757 40%, transparent);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            flex-direction: row;
        }
        #strip {
            flex: 0 0 48px;
            width: 48px;
            background: var(--bg-strip);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
            gap: 4px;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .strip-icon {
            width: 36px;
            height: 36px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 80ms ease, color 80ms ease, border-color 80ms ease;
            position: relative;
            flex: 0 0 36px;
        }
        /* Single-color SVG nav glyphs, painted with currentColor via CSS mask so
           they follow the button's idle/hover/active colors (shell.js sets the
           per-icon mask-image inline). */
        .strip-glyph {
            width: 20px;
            height: 20px;
            background-color: currentColor;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: contain;
            mask-size: contain;
        }
        .strip-icon:hover { background: var(--bg-elev); color: var(--text); }
        .strip-icon.is-active {
            background: var(--bg-elev);
            color: var(--accent);
            border-color: var(--accent-dim);
        }
        .strip-icon[disabled] {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .strip-icon[disabled]:hover { background: transparent; color: var(--text-dim); }
        /* Body-level tooltip overlay — port of kanban.html's overlay on the
           shell's own tokens. It MUST live outside #strip: the strip (and the
           nested #strip-terminals) clips overflow on both axes, which is what
           made the old in-flow hover labels invisible — painted 2px past the
           clip edge, so zero pixels survived. position:fixed + z-index here is
           exempt from every ancestor clip. */
        #tooltip-overlay {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            background: var(--bg-elev);
            color: var(--text);
            font-size: 11px;
            font-family: var(--font);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            white-space: pre-line;
            text-align: left;
            max-width: 320px;
            opacity: 0;
            visibility: hidden;
            transition: none;
        }
        #tooltip-overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        #content {
            flex: 1 1 auto;
            position: relative;
            background: var(--bg);
            overflow: hidden;
        }
        .panel-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg);
            display: none;
        }
        .panel-frame.is-active { display: block; }

        /* Modal panel host — a panel presented as an overlay (manifest
           presentation:'modal') rather than as the content area. Scoped inside
           #content on purpose: the rail stays visible and clickable beside it,
           and the body-level #tooltip-overlay (fixed, z-index 9999) still paints
           above. The host is built by shell.js, never authored here — shell.html's
           body markup is asserted to be exactly #strip / #content /
           #tooltip-overlay. */
        #modal-host { position: absolute; inset: 0; z-index: 10; display: none; }
        #modal-host.is-open { display: block; }
        #modal-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.62); }
        #modal-dialog {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(820px, 92%);
            height: min(700px, 88%);
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
        }
        /* A modal frame is shown by its HOST, never by .is-active — selectPanel
           skips modal ids for exactly this reason. */
        .modal-frame {
            flex: 1 1 auto;
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg);
            display: block;
        }
        #modal-close {
            position: absolute;
            top: 6px; right: 8px;
            z-index: 1;
            width: 26px; height: 26px;
            border: 1px solid transparent;
            border-radius: 4px;
            background: transparent;
            color: var(--text-dim);
            font-family: var(--font);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
        }
        #modal-close:hover { background: var(--bg); color: var(--text); border-color: var(--border); }

        #strip-error {
            color: var(--text-dim);
            font-size: 11px;
            padding: 12px 8px;
            text-align: center;
        }

        /* Fleet terminal strip section */
        #strip-terminals {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            overflow-y: auto;
            overflow-x: hidden;
            max-height: 40vh;
            border-top: 1px solid var(--border);
            padding-top: 6px;
            margin-top: auto;
        }
        /* No fleet yet: the separator would be a hairline pinned above the theme
           toggle with nothing under it. Retained as a defensive fallback even
           though #strip-terminals now always holds the Mission Control icon
           (ensureMissionControlIcon keeps it present) — :only-child rule below
           covers the persistent-icon case; this covers the theoretical empty
           container should that ensure ever be bypassed. */
        #strip-terminals:empty {
            border-top: none;
            padding-top: 0;
        }
        /* The Mission Control icon is a persistent first child, so :empty no longer
           matches once it is present — suppress the separator when it is the
           only child so a lone dimmed UFO does not draw a divider above an empty
           fleet list. :only-child already implies the container is non-empty, so
           no :not(:empty) guard is needed (it was redundant). */
        #strip-terminals > #strip-mission-control:only-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        /* Mission Control rail icon — a UFO button at the top of #strip-terminals.
           The SVG is INLINED into the shell document (not an <img src>), so these
           rules reach its sub-elements directly. LIT (active): the cyan lights
           blink (alternating .light-a / .light-b); the saucer, beam, and stars
           are static — at 28x16px in a narrow vertical rail, positional movement
           reads as jitter. DIMMED (inactive): everything frozen + faded via
           opacity+grayscale. The @media (prefers-reduced-motion: reduce) block
           is the ONLY reduced-motion guard now (the SVG's internal <style> was
           dropped when it was inlined), so it is load-bearing — do not remove. */
        #strip-mission-control {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
            cursor: default;
        }
        #strip-mission-control.mission-control-dimmed {
            opacity: 0.35;
            filter: grayscale(0.8);
        }
        /* Dimmed: freeze the blinking lights. This now genuinely works because
           the SVG is in the same document — the selector reaches .light-a/.light-b
           inside the inline <svg>. */
        #strip-mission-control.mission-control-dimmed .light-a,
        #strip-mission-control.mission-control-dimmed .light-b {
            animation: none !important;
        }
        #strip-mission-control.mission-control-active {
            cursor: pointer;
        }
        /* Lit: the alternating blink. Only the lights animate — no hover bob, no
           beam pulse, no star twinkle (all dropped per user decision). */
        #strip-mission-control.mission-control-active .light-a {
            animation: sb-mc-light-a 1.2s steps(2, end) infinite;
        }
        #strip-mission-control.mission-control-active .light-b {
            animation: sb-mc-light-b 1.2s steps(2, end) infinite;
        }
        @keyframes sb-mc-light-a { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .25; } }
        @keyframes sb-mc-light-b { 0%, 49% { opacity: .25; } 50%, 100% { opacity: 1; } }
        #strip-mission-control .strip-mc-icon {
            width: 28px;
            height: 16px;
            object-fit: contain;
            pointer-events: none;
        }
        /* The ONLY reduced-motion guard for the inlined SVG — its internal
           <style> was dropped when it was inlined, so this rail-level rule is
           load-bearing. Freezes the blinking lights in both lit and dimmed
           states. */
        @media (prefers-reduced-motion: reduce) {
            #strip-mission-control .light-a,
            #strip-mission-control .light-b {
                animation: none !important;
            }
        }

        /* Settings cluster at the foot of the rail. The bottom anchor (the lone
           auto top margin that absorbs the rail's free space) is handed to the
           FIRST member of this cluster at runtime by applyBottomAnchor in
           shell.js — so this rule declares only the separator and a static
           margin. A second auto top margin here would split the free space and
           park the cluster mid-rail, which is why the anchor is applied inline
           and never declared twice in CSS. */
        .strip-icon.strip-placement-bottom {
            border-top: 1px solid var(--border);
            margin-top: 6px;
        }

        .strip-term-btn {
            font-weight: 600;
            font-size: 13px;
        }
        /* Coloured brand icon replaces the old role-letter glyph + status dot. The
           icon's baked-in fill IS the identity (multi-hue brand marks), so an <img>
           is correct here — not the strip's CSS-mask/currentColor path used by the
           single-color nav glyphs. */
        .strip-term-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
            pointer-events: none;
        }
        /* exited: desaturated, lifted toward mid grey, then faded. grayscale() ALONE
           sinks the dark-fill brands (zed #084CCF, jules #715CD7, qwen #6950EF) into
           the near-black rail — the button reads EMPTY rather than "faded", which is
           a worse message than the dot ever sent. brightness() sets a contrast floor
           so every brand lands on a legible grey first; the opacity is then what says
           "gone". Readable in a monochrome screenshot, which is the accessibility
           contract the old shape coding carried. */
        .strip-term-btn.strip-term-exited .strip-term-icon {
            opacity: 0.5;
            filter: grayscale(1) brightness(1.7);
        }
        /* done: the completion ring. Same #22c55e + glow the shipped 7px dot used,
           scaled up to the whole 36px button — strictly MORE salient than the dot it
           replaces, which is the entire point of this change. Hardcoded green, NOT
           var(--accent)/var(--accent-dim): the accent is this rail's panel-SELECTION
           colour (.strip-icon.is-active), so an accent ring would read as "selected",
           and --accent-dim under theme-claudify is a 40%-alpha terracotta that is
           nearly invisible on #060609. The ring is a SHAPE (present/absent), so hue
           is a bonus channel, not the signal — monochrome and deuteranopic viewers
           read the ring itself. .strip-icon already declares `border: 1px solid
           transparent`, so this is a colour swap with zero layout shift.
           CHANGED: the ring is a NOTIFICATION, not a state. It plays ONE 2.2s
           announcement (two beats, so it reads as deliberate rather than as a render
           glitch) and fades to nothing. It used to be a permanent border driven by
           terminalBadges, which has no expiry — so a completed agent ringed its icon
           until the operator performed one specific dismissal gesture, and a rail of
           long-running agents ended up permanently green. The durable record lives in
           the Terminals panel (sidebar DONE chip, pane badge), which is unchanged.
           The 2.2s duration is mirrored by DONE_PULSE_MS in shell.js and pinned by
           shell-terminal-strip.test.js — change both or neither. */
        @keyframes strip-term-done-pulse {
            0%   { border-color: rgba(34, 197, 94, 0); box-shadow: 0 0 0 1px rgba(34, 197, 94, 0) inset, 0 0 0 rgba(34, 197, 94, 0); }
            8%   { border-color: #22c55e;             box-shadow: 0 0 0 1px #22c55e inset, 0 0 8px rgba(34, 197, 94, 0.75); }
            33%  { border-color: rgba(34, 197, 94, 0.35); box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.35) inset, 0 0 2px rgba(34, 197, 94, 0.2); }
            58%  { border-color: #22c55e;             box-shadow: 0 0 0 1px #22c55e inset, 0 0 8px rgba(34, 197, 94, 0.75); }
            100% { border-color: transparent;        box-shadow: 0 0 0 1px rgba(34, 197, 94, 0) inset, 0 0 0 rgba(34, 197, 94, 0); }
        }
        /* Reduced motion: same duration, same end state, no oscillation — hold the
           ring, then fade it. The cue is preserved; only the flashing is removed. */
        @keyframes strip-term-done-pulse-reduced {
            0%, 60% { border-color: #22c55e; box-shadow: 0 0 0 1px #22c55e inset, 0 0 6px rgba(34, 197, 94, 0.55); }
            100%    { border-color: transparent; box-shadow: 0 0 0 1px rgba(34, 197, 94, 0) inset, 0 0 0 rgba(34, 197, 94, 0); }
        }
        .strip-term-btn.strip-term-done.is-pulsing {
            animation: strip-term-done-pulse 2.2s ease-out 1 both;
        }
        @media (prefers-reduced-motion: reduce) {
            /* Swap the TRACK only. Duration, iteration count and fill-mode are
               inherited from the rule above, so DONE_PULSE_MS stays valid for both
               variants and the resume offset does not have to branch. */
            .strip-term-btn.strip-term-done.is-pulsing {
                animation-name: strip-term-done-pulse-reduced;
            }
        }
        /* active: DELIBERATELY no rule. The unmodified full-colour icon in an unringed
           button IS the live state. Never add a fade or a ring here — that absence is
           precisely what makes active distinguishable from done and exited. */

        /* Team buttons share the strip-term-btn base (sizing, done pulse, exited
           fade) via the strip-term-<light> state classes. The team icon is the
           same <img> pattern as a per-terminal brand mark; .strip-team-icon is
           an alias so theme overrides can target team icons specifically. */
        .strip-team-btn {
            font-weight: 600;
            font-size: 13px;
            position: relative;
        }
        .strip-team-btn.strip-term-exited .strip-team-icon {
            opacity: 0.5;
            filter: grayscale(1) brightness(1.7);
        }
        .strip-team-btn.strip-term-done.is-pulsing {
            animation: strip-term-done-pulse 2.2s ease-out 1 both;
        }
        @media (prefers-reduced-motion: reduce) {
            .strip-team-btn.strip-term-done.is-pulsing {
                animation-name: strip-term-done-pulse-reduced;
            }
        }
        /* Queue-depth badge — top-right corner, accent-violet. Shows pending
           work on the team rail icon. */
        .strip-team-queue-depth {
            position: absolute;
            top: 1px;
            right: 2px;
            font-size: 9px;
            font-weight: 700;
            line-height: 1;
            color: var(--accent-violet, #c586c0);
            background: var(--panel-bg, #1a1a2e);
            border-radius: 3px;
            padding: 1px 3px;
            pointer-events: none;
        }

        /* ── Right-hand agent dock ───────────────────────────────────────
           A third flex child beside #content, hosting one live agent terminal
           via /terminals?solo=&dock=1. Visibility follows the file's own
           .panel-frame / .panel-frame.is-active idiom — NEVER the [hidden]
           attribute alone: [hidden]{display:none} is a USER-AGENT rule and
           loses the cascade to any author `display` declaration on the same
           element, regardless of specificity (edge case 14). The attribute
           stays on the markup for assistive tech; the class is the mechanism.
           648px = 80 columns × 7.80px (worst-case mono advance at fontSize 13,
           Menlo/DejaVu) + 24px chrome. Below this the agent CLI inside the dock
           folds its own diffs and box frames — see edge case 13. Do not lower. */
        #agent-dock {
            flex: 0 0 auto;
            width: 648px;
            min-width: 648px;
            background: var(--bg-elev);
            border-left: 1px solid var(--border);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        #agent-dock.is-open { display: flex; }
        #dock-splitter {
            flex: 0 0 4px;
            cursor: col-resize;
            background: transparent;
            display: none;
        }
        #dock-splitter.is-open { display: block; }
        #dock-splitter:hover, #dock-splitter.is-dragging { background: var(--accent-dim); }
        #dock-header {
            flex: 0 0 32px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 6px;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-dim);
        }
        #dock-title {
            flex: 1 1 auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text);
        }
        .dock-chip {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-dim);
            font-family: var(--font);
            font-size: 11px;
            padding: 2px 6px;
            cursor: pointer;
        }
        .dock-chip:hover { color: var(--text); border-color: var(--accent-dim); }
        .dock-icon-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px;
            color: var(--text-dim);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
        }
        .dock-icon-btn:hover { color: var(--text); background: var(--bg); border-color: var(--border); }
        .dock-start-btn {
            background: var(--bg);
            border: 1px solid var(--accent-dim);
            border-radius: 6px;
            color: var(--accent);
            font-family: var(--font);
            font-size: 13px;
            padding: 8px 16px;
            cursor: pointer;
        }
        .dock-start-btn:hover { background: var(--accent-dim); color: var(--text); }
        .dock-start-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
        /* Visibility via a class, NOT the hidden attribute: [hidden]{display:none}
           is a USER-AGENT rule and loses the cascade to any author `display`
           declaration on the same element, regardless of specificity. The
           attribute stays on the markup for assistive tech; the class is the
           mechanism. Same pattern as .panel-frame / .panel-frame.is-active. */
        #dock-frame { display: none; flex: 1 1 auto; border: none; width: 100%; background: var(--bg); }
        #dock-frame.is-visible { display: block; }
        #dock-empty {
            display: none;
            flex: 1 1 auto;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            text-align: center;
        }
        #dock-empty.is-visible { display: flex; }
        #dock-empty-hint { font-size: 11px; color: var(--text-dim); line-height: 1.5; }
        /* position:fixed escapes #agent-dock's overflow:hidden — no ancestor here
           establishes a fixed-position containing block (no transform/filter/
           will-change/contain). Same idiom as #tooltip-overlay. */
        #dock-role-menu {
            display: none;
            position: fixed;
            z-index: 9999;
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px;
            min-width: 180px;
        }
        #dock-role-menu.is-visible { display: block; }
        .dock-role-item {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            border-radius: 3px;
            color: var(--text);
            font-family: var(--font);
            font-size: 12px;
            padding: 5px 8px;
            cursor: pointer;
        }
        .dock-role-item:hover { background: var(--bg); }
        .dock-role-item.is-selected { color: var(--accent); }
        /* Splitter drag: iframes swallow mousemove, so both the panel frames and
           the dock frame go pointer-inert for the duration of the drag. Without
           this the drag dies the instant the cursor crosses into a frame. */
        body.dock-dragging .panel-frame,
        body.dock-dragging #dock-frame { pointer-events: none; }

        /* Browser-only shell: dark native palette + a 6px strip scrollbar to
           match the panels it frames. #strip is the document's only scroller
           (html, body are overflow:hidden). No --vscode-* fallback — the shell
           has no VS Code webview equivalent. */
        :root { color-scheme: dark; }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-corner {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-dim);
        }

        /* Firefox only — see the note in memo.html. Never hoist these out of
           the gate: they would disable the ::-webkit-* rules above in
           Chromium 121+ / Safari 17.4+. */
        @supports not selector(::-webkit-scrollbar) {
            :root {
                scrollbar-width: thin;
                scrollbar-color: var(--border) transparent;
            }
        }
        /* Pixel-art <img> treatment — one class per webview document (these
           documents share no sheet). Integer display sizes plus `pixelated`
           keep raster art hard-edged; applied to art <img> elements by the
           surface-render code. Harmless on elements that do not use it. */
        .pixel-art {
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }
    </style>
</head>

<body>
    <div id="strip" role="tablist" aria-label="Switchboard panels"></div>
    <div id="content"></div>
    <div id="dock-splitter" role="separator" aria-orientation="vertical"
         aria-label="Resize agent dock" hidden></div>
    <aside id="agent-dock" aria-label="Agent dock" hidden>
        <div id="dock-header">
            <button id="dock-role-btn" type="button" class="dock-chip"
                    data-tooltip="Choose which agent this dock starts"></button>
            <span id="dock-title"></span>
            <button id="dock-close" type="button" class="dock-icon-btn"
                    aria-label="Close agent dock" data-tooltip="Close">&times;</button>
        </div>
        <div id="dock-role-menu" hidden></div>
        <div id="dock-empty">
            <button id="dock-start" type="button" class="dock-start-btn"></button>
            <div id="dock-empty-hint"></div>
        </div>
        <iframe id="dock-frame" title="Agent terminal"
                allow="clipboard-read; clipboard-write" hidden></iframe>
    </aside>
    <div id="tooltip-overlay"></div>
    <script nonce="{{NONCE}}" src="/static/webview/sharedDefaults.js"></script>
    <script nonce="{{NONCE}}" src="/static/webview/shell.js"></script>
</body>

</html>
